name: Build & boot-test the iOS 6 Arch ISO

on:
  workflow_dispatch:
  push:
    branches: ["claude/plugins-ebc4oq", "main", "master"]
    paths:
      - ".github/workflows/build-iso.yml"
      - "os/**"

jobs:
  build-iso:
    name: mkarchiso (real Arch, real kernel)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install archiso toolchain
        run: |
          pacman-key --init
          pacman -Syu --noconfirm archiso grub mtools
      - name: Build ISO
        run: |
          bash os/archiso/build-iso.sh /build
          mkdir -p out
          mv /build/out/*.iso out/
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: ios6-arch-iso
          path: out/*.iso
          retention-days: 14

  boot-test:
    name: QEMU boot test with screenshots
    needs: build-iso
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios6-arch-iso
          path: iso

      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils imagemagick
          # GitHub-hosted runners expose KVM once the udev rule is set
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "no KVM — falling back to TCG"

      - name: Boot ISO headless and capture screendumps
        run: |
          ISO=$(ls iso/*.iso)
          ACCEL=$( [ -e /dev/kvm ] && echo kvm || echo tcg )
          mkdir -p shots
          qemu-system-x86_64 \
            -accel "$ACCEL" -m 3072 -smp 2 \
            -cdrom "$ISO" -boot d \
            -device virtio-vga \
            -display none \
            -serial file:serial.log \
            -qmp unix:/tmp/qmp.sock,server,nowait \
            -no-reboot &
          QPID=$!
          screendump() {
            python3 - "$1" <<'PYEOF'
          import json, socket, sys, time
          s = socket.socket(socket.AF_UNIX)
          s.connect("/tmp/qmp.sock")
          f = s.makefile("rw")
          f.readline()
          f.write(json.dumps({"execute": "qmp_capabilities"}) + "\n"); f.flush(); f.readline()
          f.write(json.dumps({"execute": "screendump",
                              "arguments": {"filename": sys.argv[1]}}) + "\n")
          f.flush(); f.readline()
          PYEOF
          }
          # the shell needs time: ISO boot menu -> kernel -> systemd -> cage -> chromium
          for t in 45 90 150 240 360; do
            sleep_left=$t; while [ $sleep_left -gt 0 ] && kill -0 $QPID 2>/dev/null; do sleep 5; sleep_left=$((sleep_left-5)); done
            kill -0 $QPID 2>/dev/null || break
            screendump shots/boot-${t}s.ppm || true
          done
          kill $QPID 2>/dev/null || true
          for f in shots/*.ppm; do convert "$f" "${f%.ppm}.png" && rm "$f"; done
          ls -lh shots/ || true
          tail -50 serial.log || true

      - name: Sanity-check captures
        run: |
          count=$(ls shots/*.png 2>/dev/null | wc -l)
          echo "captured $count screenshots"
          [ "$count" -ge 2 ] || { echo "::error::boot produced fewer than 2 screendumps"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: boot-screenshots
          path: shots/*.png
          retention-days: 14

  build-utm-aarch64:
    name: UTM image (Arch Linux ARM, Apple Silicon native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdisk dosfstools e2fsprogs rsync qemu-utils \
            qemu-system-arm qemu-efi-aarch64

      - name: Build qcow2
        run: |
          sudo bash os/utm/build-utm-aarch64.sh /build
          mkdir -p out && sudo mv /build/ios6-arch-aarch64.qcow2 out/
          sudo chown "$USER" out/*.qcow2
          ls -lh out/

      - name: Boot smoke test (UEFI serial console)
        run: |
          cp /usr/share/qemu-efi-aarch64/QEMU_EFI.fd efi.fd
          truncate -s 64M efivars.fd
          qemu-system-aarch64 \
            -M virt -cpu max -m 2048 -smp 2 -accel tcg,thread=multi \
            -drive if=pflash,format=raw,file=efi.fd,readonly=on \
            -drive if=pflash,format=raw,file=efivars.fd \
            -drive file=out/ios6-arch-aarch64.qcow2,if=virtio \
            -display none -serial file:serial.log \
            -no-reboot &
          QPID=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 10
            if grep -aq "arch-iphone login:" serial.log; then ok=1; break; fi
            kill -0 $QPID 2>/dev/null || break
          done
          kill $QPID 2>/dev/null || true
          echo "=== serial tail ==="; tail -40 serial.log || true
          [ "$ok" = 1 ] || { echo "::error::image did not reach login/autostart on serial"; exit 1; }
          echo "boot reached arch-iphone autologin — shell autostarts on tty1"

      - uses: actions/upload-artifact@v4
        with:
          name: ios6-arch-utm-aarch64
          path: out/*.qcow2
          retention-days: 14
