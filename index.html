<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS 6 · Arch Edition</title>
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/apps.css">
</head>
<body>
<div id="stage">
  <div id="device">
    <div class="dev-earpiece"></div>
    <div class="dev-camera"></div>
    <button id="power-btn" title="Sleep/Wake"></button>
    <div class="dev-volume dev-vol-up"></div>
    <div class="dev-volume dev-vol-down"></div>

    <div id="screen">
      <!-- Wallpaper layers -->
      <div id="wallpaper" class="wp-water"></div>

      <!-- Springboard (home screen) -->
      <div id="home" class="layer hidden">
        <div id="pages"></div>
        <div id="page-dots"></div>
        <div id="dock"><div id="dock-icons"></div></div>
      </div>

      <!-- App layer -->
      <div id="app" class="layer hidden"></div>

      <!-- Lock screen -->
      <div id="lock" class="layer hidden">
        <div class="lock-top">
          <div class="lock-time">9:41</div>
          <div class="lock-date">Wednesday, September 12</div>
        </div>
        <div class="lock-bottom">
          <div class="lock-track">
            <div class="lock-thumb"><span class="lock-arrow">&#x2192;</span></div>
            <div class="lock-label">slide to unlock</div>
          </div>
        </div>
      </div>

      <!-- Status bar -->
      <div id="statusbar" class="sb-black hidden">
        <div class="sb-left">
          <span class="sb-signal"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="sb-carrier">arch</span>
          <span class="sb-wifi"><svg width="13" height="10" viewBox="0 0 14 10"><path d="M7 9.4 L4.7 6.6 a3.6 3.6 0 0 1 4.6 0 z" fill="currentColor"/><path d="M2.8 4.5 a6.6 6.6 0 0 1 8.4 0 L10 5.9 a4.7 4.7 0 0 0 -6 0 z" fill="currentColor"/><path d="M0.7 2.3 a10 10 0 0 1 12.6 0 L12.1 3.8 a8 8 0 0 0 -10.2 0 z" fill="currentColor"/></svg></span>
        </div>
        <div class="sb-time">9:41 AM</div>
        <div class="sb-right">
          <span class="sb-bt hidden">&#xF8FF;</span>
          <span class="sb-moon hidden"><svg width="12" height="12" viewBox="0 0 16 16"><path d="M10.5 1.2 A7.2 7.2 0 1 0 15 10.8 A5.9 5.9 0 0 1 10.5 1.2 Z" fill="currentColor"/></svg></span>
          <span class="sb-batt-pct">100%</span>
          <span class="sb-batt"><i></i></span>
        </div>
      </div>

      <!-- Keyboard -->
      <div id="keyboard" class="hidden"></div>

      <!-- Boot layer -->
      <div id="boot" class="layer">
        <pre id="boot-log"></pre>
        <div id="boot-apple" class="hidden">
          <div class="apple-logo">&#xF8FF;</div>
          <div class="boot-spinner"></div>
        </div>
      </div>

      <!-- Screen off -->
      <div id="screen-off" class="layer hidden"></div>

      <!-- Brightness overlay -->
      <div id="dimmer"></div>
    </div>

    <button id="home-btn" title="Home"><span></span></button>
  </div>
  <div id="hint">click the screen to power on &nbsp;·&nbsp; home button below · power button top-right</div>
</div>

<script src="js/data.js"></script>
<script src="js/native.js"></script>
<script src="js/icons.js"></script>
<script src="js/glyphs.js"></script>
<script src="js/system.js"></script>
<script src="js/apps/communication.js"></script>
<script src="js/apps/productivity.js"></script>
<script src="js/apps/media.js"></script>
<script src="js/apps/store.js"></script>
<script src="js/apps/extras.js"></script>
<script src="js/shell-extras.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
