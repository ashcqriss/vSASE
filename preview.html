    <ellipse cx="20" cy="43" rx="5.5" ry="3.4"/>
    <path d="M35 22 c-3 -7 -2 -13 2 -15 c4 -2 8 1 9 7 c0.8 5 -0.5 8 -4 9.5 c-3 1.3 -5.6 0.6 -7 -1.5z" opacity="0.6"/>
    <ellipse cx="37" cy="31" rx="5.5" ry="3.4" opacity="0.6"/>
  </g>
  ${XGLOSS}</svg>`;

const iconObsidian = () => `<svg viewBox="0 0 57 57" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="ob_bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a2a5e"/><stop offset="1" stop-color="#181028"/></linearGradient>
  <linearGradient id="ob_gem" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b8a0f8"/><stop offset="0.55" stop-color="#7a52e0"/><stop offset="1" stop-color="#4a2aa0"/></linearGradient></defs>
  <rect width="57" height="57" fill="url(#ob_bg)"/>
  <path d="M23 8 L40 14 L44 34 L31 49 L17 40 L15 20 z" fill="url(#ob_gem)" stroke="#241448" stroke-width="1.2"/>
  <path d="M23 8 L28 24 L15 20 z" fill="#cdbcfa" opacity="0.75"/>
  <path d="M28 24 L40 14 L44 34 z" fill="#8f6af0" opacity="0.7"/>
  <path d="M28 24 L44 34 L31 49 z" fill="#5c38c0" opacity="0.8"/>
  <path d="M28 24 L31 49 L17 40 L15 20 z" fill="#6f48d8" opacity="0.65"/>
  ${XGLOSS}</svg>`;

const iconClipper = () => `<svg viewBox="0 0 57 57" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="cl_bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6a4ad0"/><stop offset="1" stop-color="#2e1a70"/></linearGradient></defs>
  <rect width="57" height="57" fill="url(#cl_bg)"/>
  <rect x="14" y="10" width="26" height="34" rx="3" fill="#f4f2fa" stroke="#b8aee0"/>
  ${[17, 22, 27, 32].map(y => `<rect x="18" y="${y}" width="18" height="2" rx="1" fill="#b0a4d8"/>`).join("")}
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M30 40 L44 26"/><path d="M30 26 L44 40"/>
  </g>
  <circle cx="28" cy="42" r="4" fill="none" stroke="#ffffff" stroke-width="2.6"/>
  <circle cx="28" cy="24" r="4" fill="none" stroke="#ffffff" stroke-width="2.6"/>
  ${XGLOSS}</svg>`;

/* =================================================================
   LazyVim — a modal editor with a plugin manager, phone edition
   ================================================================= */

const LazyVimApp = {
  id: "lazyvim", name: "LazyVim", price: "FREE",
  desc: "Modal editing for one thumb",
  bg: "#12141f", glyph: "keypad", icon: iconLazyVim,
  rootClass: "lv-root",
  onClose() { document.removeEventListener("keydown", this._kh); },
  render(root) {
    const def = IOS.app("lazyvim");
    let lines = Prefs.get("lvBuffer", [
      "# notes.md — edited with LazyVim (phone edition)",
      "",
      "hjkl move · i insert · Esc normal",
      "x delete char · dd delete line · o new line",
      ":w write · :q dashboard · :Lazy plugins"
    ]);
    let mode = "NORMAL", row = 0, col = 0, cmd = "", pendingKey = "", msg = "";
    let view = "dash"; // dash | edit | lazy

    const screen = h("pre", "lv-screen");
    const status = h("div", "lv-status");
    const body = h("div", { style: { flex: "1", display: "flex", flexDirection: "column", overflow: "hidden" } });

    const PLUGINS = [
      ["lazy.nvim", "loaded", "3.1ms"], ["telescope", "lazy", "—"],
      ["treesitter", "loaded", "8.4ms"], ["which-key", "lazy", "—"],
      ["lualine", "loaded", "1.9ms"], ["gitsigns", "lazy", "—"],
      ["noice", "lazy", "—"], ["mini.pairs", "loaded", "0.6ms"]
    ];

    function clampCursor() {
      row = Math.max(0, Math.min(lines.length - 1, row));
      col = Math.max(0, Math.min(Math.max(0, (lines[row] || "").length - (mode === "NORMAL" ? 1 : 0)), col));
    }

    function paint() {
      body.innerHTML = "";
      if (view === "dash") {
        body.append(h("div", "lv-dash",
          h("pre", "lv-logo",
            "  _              __     ___\n" +
            " | |   __ _ ___ _\\ \\   / (_)_ __ ___\n" +
            " | |  / _` |_  / | \\ \\ / /| | '_ ` _ \\\n" +
            " | |_| (_| |/ /| |_ \\ V / | | | | | | |\n" +
            " |____\\__,_/___|\\__, \\_/  |_|_| |_| |_|\n" +
            "                |___/   phone edition"),
          h("button", { class: "lv-btn", onclick: () => { Snd.click(); view = "edit"; paint(); } }, "e — edit notes.md"),
          h("button", { class: "lv-btn", onclick: () => { Snd.click(); view = "lazy"; paint(); } }, "l — :Lazy plugins"),
          h("button", { class: "lv-btn", onclick: () => { Snd.click(); IOS.goHome(); } }, "q — quit to springboard"),
          h("div", "lv-hint", "startup: 42 plugins, 38 lazy-loaded, 11.2ms")));
        return;
      }
      if (view === "lazy") {
        body.append(h("div", "lv-lazy",
          h("div", "lv-lazy-head", "lazy.nvim — plugin status"),
          ...PLUGINS.map(([n, st, t]) => h("div", "lv-lazy-row",
            h("span", { class: st === "loaded" ? "lv-ok" : "lv-dim" }, st === "loaded" ? "●" : "○"),
            h("span", { style: { flex: "1" } }, " " + n),
            h("span", "lv-dim", st === "loaded" ? t : "lazy"))),
          h("div", "lv-hint", "everything you did not press a key for stays unloaded"),
          h("button", { class: "lv-btn", onclick: () => { Snd.click(); view = "edit"; paint(); } }, "back to buffer")));
        return;
      }
      // editor
      screen.innerHTML = "";
      lines.forEach((ln, r) => {
        const div = h("div");
        if (r === row) {
          const c = Math.min(col, Math.max(0, ln.length));
          div.append(document.createTextNode(ln.slice(0, c)));
          div.append(h("span", "lv-cursor" + (mode === "INSERT" ? " ins" : ""), ln[c] || " "));
          div.append(document.createTextNode(ln.slice(c + 1)));
        } else div.textContent = ln || " ";
        screen.append(div);
      });
      status.textContent = mode === "CMD" ? ":" + cmd
        : "-- " + mode + " --  notes.md  " + (row + 1) + ":" + (col + 1) + (msg ? "  " + msg : "");
      body.append(screen, status);
      screen.scrollTop = Math.max(0, (row - 8) * 15);
    }

    function execCmd() {
      const c = cmd.trim();
      msg = "";
      if (c === "w" || c === "wq") {
        Prefs.set("lvBuffer", lines);
        msg = '"notes.md" ' + lines.length + "L written";
        if (c === "wq") view = "dash";
      } else if (c === "q" || c === "q!") view = "dash";
      else if (c.toLowerCase() === "lazy") view = "lazy";
      else if (c === "help") msg = "you are beyond help. try :w, :q, :Lazy";
      else msg = "E492: not an editor command: " + c;
      cmd = ""; mode = "NORMAL";
      paint();
    }

    function feed(k) {
      if (view !== "edit") {
        if (view === "dash") { if (k === "e") { view = "edit"; } else if (k === "l") view = "lazy"; else if (k === "q") return IOS.goHome(); }
        else if (view === "lazy" && (k === "q" || k === "Escape")) view = "edit";
        paint();
        return;
      }
      msg = "";
      if (mode === "CMD") {
        if (k === "Enter") return execCmd();
        if (k === "Escape") { cmd = ""; mode = "NORMAL"; }
        else if (k === "Backspace") cmd = cmd.slice(0, -1);
        else if (k.length === 1) cmd += k;
        paint();
        return;
      }
      if (mode === "INSERT") {
        if (k === "Escape") { mode = "NORMAL"; col = Math.max(0, col - 1); }
        else if (k === "Enter") {
          const rest = lines[row].slice(col);
          lines[row] = lines[row].slice(0, col);
          lines.splice(row + 1, 0, rest); row++; col = 0;
        } else if (k === "Backspace") {
          if (col > 0) { lines[row] = lines[row].slice(0, col - 1) + lines[row].slice(col); col--; }
          else if (row > 0) { col = lines[row - 1].length; lines[row - 1] += lines[row]; lines.splice(row, 1); row--; }
        } else if (k.length === 1) {
          lines[row] = lines[row].slice(0, col) + k + lines[row].slice(col); col++;
        }
        clampCursor(); paint();
        return;
      }
      // NORMAL
      if (pendingKey === "d") {
        pendingKey = "";
        if (k === "d") { lines.splice(row, 1); if (!lines.length) lines = [""]; clampCursor(); msg = "1 line deleted"; }
      } else if (pendingKey === "g") {
        pendingKey = "";
        if (k === "g") { row = 0; col = 0; }
      } else if (k === "h") col--;
      else if (k === "l") col++;
      else if (k === "j") row++;
      else if (k === "k") row--;
      else if (k === "0") col = 0;
      else if (k === "$") col = Math.max(0, lines[row].length - 1);
      else if (k === "G") { row = lines.length - 1; }
      else if (k === "g") pendingKey = "g";
      else if (k === "d") pendingKey = "d";
      else if (k === "x") { lines[row] = lines[row].slice(0, col) + lines[row].slice(col + 1); }
      else if (k === "i") mode = "INSERT";
      else if (k === "a") { mode = "INSERT"; col++; }
      else if (k === "o") { lines.splice(row + 1, 0, ""); row++; col = 0; mode = "INSERT"; }
      else if (k === ":") { mode = "CMD"; cmd = ""; }
      clampCursor(); paint();
    }

    // hardware keys
    def._kh = e => {
      if (KB.visible) return;
      if (["Shift", "Control", "Alt", "Meta"].includes(e.key)) return;
      e.preventDefault();
      feed(e.key);
    };
    document.addEventListener("keydown", def._kh);

    // on-screen keyboard routes through a hidden field
    const field = kbField("", {
      onChange: v => { if (v.length) { feed(v[v.length - 1]); field._value = ""; field._renderValue(); } },
      onReturn: () => feed("Enter")
    });
    field.style.position = "absolute"; field.style.left = "-9999px";
    body.addEventListener("click", () => { if (view === "edit") KB.open(field); });

    const escBtn = navBtn("Esc", () => feed("Escape"));
    root.append(navbar("LazyVim", { dark: true, left: escBtn,
      right: navBtn("⌫", () => feed("Backspace")) }), body, field);
    paint();
  }
};

/* =================================================================
   Step Counter — real accelerometer when the hardware has one
   ================================================================= */

const StepsApp = {
  id: "steps", name: "Steps", price: "FREE",
  desc: "Count steps with the real accelerometer",
  bg: "#3f8a2a", glyph: "person", icon: iconSteps,
  onClose() {
    window.removeEventListener("devicemotion", this._mh);
    clearInterval(this._iv);
  },
  render(root) {
    const def = IOS.app("steps");
    const GOAL = 10000;
    const today = new Date().toISOString().slice(0, 10);
    const hist = () => Prefs.get("stepsHist", {});
    const setToday = n => { const hh = hist(); hh[today] = n; Prefs.set("stepsHist", hh); };
    let steps = hist()[today] || 0;
    let tracking = false, lastStep = 0, gotMotion = false;

    const big = h("div", "steps-big", String(steps));
    const bar = h("i");
    const sub = h("div", "steps-sub");
    const shoe = h("div", { class: "steps-shoe", html: iconSteps() });
    const toggle = h("button", "big-blue-btn", "Start Tracking");

    function paint() {
      big.textContent = steps.toLocaleString();
      bar.style.width = Math.min(100, steps / GOAL * 100) + "%";
      sub.textContent = steps >= GOAL
        ? "Goal reached. The couch has lost this round."
        : (GOAL - steps).toLocaleString() + " steps to your " + GOAL.toLocaleString() + " goal";
    }

    function onStep() {
      steps++; setToday(steps); paint();
      if (steps % 100 === 0) Snd.click();
    }

    def._mh = e => {
      if (!tracking) return;
      gotMotion = true;
      const a = e.accelerationIncludingGravity;
      if (!a) return;
      const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
      const now = Date.now();
      if (Math.abs(mag - 9.81) > 2.4 && now - lastStep > 340) { lastStep = now; onStep(); }
    };
    window.addEventListener("devicemotion", def._mh);

    toggle.addEventListener("click", async () => {
      Snd.click();
      tracking = !tracking;
      toggle.textContent = tracking ? "Stop Tracking" : "Start Tracking";
      if (tracking) {
        // iOS 13+ Safari gates motion events behind a permission prompt
        // that must be requested from a user gesture — this click is one
        if (typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function") {
          try { await DeviceMotionEvent.requestPermission(); } catch (e) { /* denied → tap mode */ }
        }
        gotMotion = false;
        def._iv = setTimeout(() => {
          if (!gotMotion) sub.textContent = "No accelerometer here — tap the shoe to take steps.";
        }, 2500);
      }
    });
    shoe.addEventListener("click", () => { Snd.key(); onStep(); });

    // last 7 days chart
    const chart = h("div", "steps-chart");
    for (let i = 6; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
      const v = d === today ? steps : (hist()[d] || 0);
      chart.append(h("div", "steps-col",
        h("div", { class: "steps-colbar", style: { height: Math.min(56, v / GOAL * 56) + "px" } }),
        h("div", "steps-collbl", d.slice(8))));
    }

    root.append(
      navbar("Steps"),
      h("div", { class: "content grouped", style: { textAlign: "center" } },
        shoe, big,
        h("div", "steps-track", bar), sub,
        h("div", { style: { padding: "10px 4px" } }, toggle),
        h("div", "group-label", "Last 7 days"),
        h("div", "group", chart),
        h("div", "group-foot", "On a phone this reads the real accelerometer. On a desktop it reads your finger.")));
    paint();
  }
};

/* =================================================================
   Obsidian — linked notes and a graph, dressed for 2012
   ================================================================= */

const ObsidianApp = {
  id: "obsidian", name: "Obsidian", price: "FREE",
  desc: "A second brain with [[links]] and a graph",
  bg: "#181028", glyph: "book", icon: iconObsidian,
  rootClass: "ob-root",
  render(root) {
    const nav = new UINav(root);

    function editor(title) {
      let note = ObsidianVault.get(title);
      if (!note) { ObsidianVault.upsert(title, "New note.\n\nLink things with [[Start Here]]."); note = ObsidianVault.get(title); }
      const paper = h("div", { class: "ob-paper", contenteditable: "plaintext-only", spellcheck: "false" });
      paper.textContent = note.body;
      paper.addEventListener("input", () => ObsidianVault.upsert(title, paper.textContent));
      const linkBar = h("div", "ob-links");
      function paintLinks() {
        linkBar.innerHTML = "";
        const ls = ObsidianVault.linksOf({ body: paper.textContent });
        if (!ls.length) linkBar.append(h("span", "ob-dim", "no [[links]] yet"));
        ls.forEach(l => linkBar.append(h("span", { class: "ob-chip", onclick: () => { Snd.click(); editor(l); } }, l)));
      }
      paper.addEventListener("input", paintLinks);
      nav.push(navView(
        navbar(title, { dark: true, left: backBtn("Vault", () => nav.pop()),
          right: navBtn(gl("trash", 14), () => showSheet([
            { label: "Delete “" + title + "”", style: "destructive", onTap: () => { ObsidianVault.remove(title); nav.pop(); refreshList(); } },
            { label: "Cancel", style: "cancel" }])) }),
        paper, linkBar));
      paintLinks();
    }

    function graphView() {
      const c = h("canvas", { width: 320, height: 340, style: { width: "100%", flex: "1", background: "#141020" } });
      const g = c.getContext("2d");
      const ns = ObsidianVault.notes();
      const idx = Object.fromEntries(ns.map((n, i) => [n.title.toLowerCase(), i]));
      const pos = ns.map((_, i) => {
        const a = i * 2 * Math.PI / ns.length - Math.PI / 2;
        return { x: 160 + Math.cos(a) * 100, y: 165 + Math.sin(a) * 110 };
      });
      // light spring relaxation so linked notes drift together
      for (let it = 0; it < 80; it++) {
        ns.forEach((n, i) => ObsidianVault.linksOf(n).forEach(l => {
          const j = idx[l.toLowerCase()];
          if (j === undefined) return;
          const dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y;
          pos[i].x += dx * 0.01; pos[i].y += dy * 0.01;
          pos[j].x -= dx * 0.01; pos[j].y -= dy * 0.01;
        }));
        for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
          const dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < 70) { const f = (70 - d) / d * 0.06; pos[i].x -= dx * f; pos[i].y -= dy * f; pos[j].x += dx * f; pos[j].y += dy * f; }
        }
      }
      g.strokeStyle = "rgba(150,120,240,.45)"; g.lineWidth = 1.4;
      ns.forEach((n, i) => ObsidianVault.linksOf(n).forEach(l => {
        const j = idx[l.toLowerCase()];
        if (j === undefined) return;
        g.beginPath(); g.moveTo(pos[i].x, pos[i].y); g.lineTo(pos[j].x, pos[j].y); g.stroke();
      }));
      ns.forEach((n, i) => {
        const r = 6 + Math.min(6, ObsidianVault.linksOf(n).length * 2);
        const grad = g.createRadialGradient(pos[i].x - 2, pos[i].y - 2, 1, pos[i].x, pos[i].y, r);
        grad.addColorStop(0, "#c8b4fa"); grad.addColorStop(1, "#6a42d8");
        g.fillStyle = grad;
        g.beginPath(); g.arc(pos[i].x, pos[i].y, r, 0, 7); g.fill();
        g.fillStyle = "#cfc4ee"; g.font = "10px Helvetica"; g.textAlign = "center";
        g.fillText(n.title.slice(0, 16), pos[i].x, pos[i].y + r + 11);
      });
      c.addEventListener("click", e => {
        const rct = c.getBoundingClientRect();
        const x = (e.clientX - rct.left) * (320 / rct.width), y = (e.clientY - rct.top) * (340 / rct.height);
        const i = ns.findIndex((_, k) => Math.hypot(pos[k].x - x, pos[k].y - y) < 16);
        if (i >= 0) { Snd.click(); editor(ns[i].title); }
      });
      nav.push(navView(
        navbar("Graph", { dark: true, left: backBtn("Vault", () => nav.pop()) }),
        c,
        h("div", { class: "ob-links", style: { justifyContent: "center" } },
          h("span", "ob-dim", "tap a node to open the note"))));
    }

    let listEl;
    function refreshList() {
      listEl.innerHTML = "";
      ObsidianVault.notes().forEach(n => listEl.append(cell({
        label: n.title,
        sub: n.body.split("\n")[0].slice(0, 44),
        chev: true, onTap: () => editor(n.title)
      })));
    }
    listEl = h("div", "content list ob-list");
    nav.push(navView(
      navbar("Obsidian", { dark: true,
        left: navBtn(gl("share", 14), () => graphView()),
        right: navBtn("+", () => {
          const name = "Note " + (ObsidianVault.notes().length + 1);
          ObsidianVault.upsert(name, "");
          refreshList(); editor(name);
        }) }),
      listEl,
      h("div", { class: "ob-links", style: { justifyContent: "center" } },
        h("span", "ob-dim", "◈ graph is top-left · [[double brackets]] make links"))), false);
    refreshList();
  }
};

/* =================================================================
   Obsidian Web Clipper — lives in Safari's share sheet
   ================================================================= */

const ClipperApp = {
  id: "clipper", name: "Web Clipper", price: "FREE",
  desc: "Clip Safari pages into your vault",
  bg: "#2e1a70", glyph: "compose", icon: iconClipper,
  rootClass: "ob-root",
  render(root) {
    const list = h("div", "content list ob-list");
    function paint() {
      list.innerHTML = "";
      const clips = ObsidianVault.notes().filter(n => n.title.startsWith("Clip: "));
      if (!clips.length) list.append(h("div", "empty-msg",
        "No clips yet.\nOpen Safari, browse to a page, tap the share button and choose “Clip to Obsidian”."));
      clips.forEach(n => list.append(cell({
        label: n.title.slice(6), sub: n.body.split("\n")[0],
        chev: true,
        onTap: () => { IOS.open("obsidian"); }
      })));
    }
    root.append(
      navbar("Web Clipper", { dark: true, right: navBtn("Safari", () => IOS.open("safari")) }),
      h("div", "cydia-hero",
        h("div", { class: "cydia-hero-ico", html: iconClipper() }),
        h("div", null, h("b", { style: { color: "#e8e2fa" } }, "Highlight the web"),
          h("div", { class: "cydia-sub", style: { color: "#b0a4d8" } }, "Anything you clip in Safari lands in the Obsidian vault, linked under [[Clips]]."))),
      list);
    paint();
  }
};

/* register everything with the App Store */
AppMarket.addApps([LazyVimApp, StepsApp, ObsidianApp, ClipperApp]);

</script>
<script>
/* ===================================================================
   iOS 6 · Arch Edition — system services, wave two
   Notification Center · banners · app switcher · slide-to-power-off ·
   Siri · passcode lock · Spotlight · auto-lock · firing alarms ·
   incoming calls & texts (simulated locally, ModemManager on hardware)
   Loaded last: may reference IOS, apps, stores and players.
   =================================================================== */
"use strict";

const ShellX = (() => {
  const screen = $id("screen");

  /* =============================================================
     Notifications: banners + the pull-down center
     ============================================================= */
  const NOTIFS = []; // {app, title, text, time}

  /* ---- Do Not Disturb: iOS 6's headline feature, for real ---- */
  const DND = {
    active: () => Prefs.get("dnd", false),
    refresh() {
      const m = document.querySelector(".sb-moon");
      if (m) m.classList.toggle("hidden", !DND.active());
      const pct = document.querySelector(".sb-batt-pct");
      if (pct) pct.classList.toggle("hidden", !Prefs.get("battPct", true));
    }
  };
  window.DND = DND;
  DND.refresh();

  const Notify = {
    push(appId, title, text, { silent = false } = {}) {
      NOTIFS.unshift({ app: appId, title, text, time: fmtTime(new Date()) });
      if (NOTIFS.length > 30) NOTIFS.pop();
      if (DND.active()) { if (IOS.state === "home") IOS.buildHome(); return; } // straight to the NC list, no light, no sound
      if (!silent) Snd.received();
      const def = IOS.app(appId);
      const b = h("div", "nc-banner",
        h("div", { class: "nc-banner-ico", html: def ? def.icon() : "" }),
        h("div", "nc-banner-txt", h("b", null, title), h("span", null, text)));
      b.addEventListener("click", () => { b.remove(); if (def) IOS.open(appId); });
      screen.append(b);
      setTimeout(() => { b.classList.add("out"); setTimeout(() => b.remove(), 400); }, 4200);
      if (IOS.state === "home") IOS.buildHome();
    }
  };

  /* ---- Notification Center panel ---- */
  const nc = h("div", { id: "notif-center", class: "hidden" });
  screen.append(nc);
  let ncOpen = false;

  function paintNC() {
    nc.innerHTML = "";
    nc.append(h("div", "nc-widget",
      h("div", "nc-widget-title", "Weather"),
      h("div", "nc-weather",
        h("span", { class: "w-i", html: Glyphs.wsun() }),
        h("span", null, "Cupertino — 73° sunny, high 75°"))));
    const stk = (typeof STOCKS !== "undefined" ? STOCKS : []).slice(0, 3)
      .map(s => s.sym + " " + (s.chg >= 0 ? "▲" : "▼") + Math.abs(s.chg).toFixed(2)).join("   ");
    nc.append(h("div", "nc-widget", h("div", "nc-widget-title", "Stocks"), h("div", "nc-stocks", stk)));
    if (!NOTIFS.length) {
      nc.append(h("div", "nc-empty", "No New Notifications"));
    } else {
      const list = h("div", "nc-list");
      NOTIFS.forEach(n => {
        const def = IOS.app(n.app);
        const row = h("div", "nc-row",
          h("div", { class: "nc-banner-ico", html: def ? def.icon() : "" }),
          h("div", "nc-banner-txt", h("b", null, n.title), h("span", null, n.text)),
          h("span", "nc-time", n.time));
        row.addEventListener("click", () => { closeNC(); if (def) IOS.open(n.app); });
        list.append(row);
      });
      const clear = h("button", "nc-clear", "Clear");
      clear.addEventListener("click", () => { NOTIFS.length = 0; paintNC(); });
      nc.append(h("div", "nc-widget-title", "Notifications ", clear), list);
    }
    nc.append(h("div", { class: "nc-grab", onclick: closeNC }, h("i")));
  }
  function openNC() {
    if (IOS.state !== "home" && IOS.state !== "app") return;
    ncOpen = true; paintNC();
    nc.classList.remove("hidden");
    requestAnimationFrame(() => nc.classList.add("open"));
  }
  function closeNC() {
    ncOpen = false;
    nc.classList.remove("open");
    setTimeout(() => nc.classList.add("hidden"), 320);
  }
  // pull down from the status bar
  (() => {
    const sb = $id("statusbar");
    let y0 = null;
    sb.addEventListener("pointerdown", e => { y0 = e.clientY; });
    sb.addEventListener("pointerup", e => {
      if (y0 !== null && (e.clientY - y0 > 18 || e.clientY - y0 >= 0)) { ncOpen ? closeNC() : openNC(); }
      y0 = null;
    });
  })();

  /* =============================================================
     App switcher (double-press home) + Siri (long-press home)
     ============================================================= */
  const RECENTS = [];
  const _open = IOS.open.bind(IOS);
  IOS.open = id => {
    const i = RECENTS.indexOf(id);
    if (i >= 0) RECENTS.splice(i, 1);
    RECENTS.unshift(id);
    if (RECENTS.length > 8) RECENTS.pop();
    _open(id);
  };

  const switcher = h("div", { id: "switcher", class: "hidden" });
  screen.append(switcher);
  let swOpen = false;
  function toggleSwitcher() {
    if (swOpen) { switcher.classList.add("hidden"); swOpen = false; return; }
    switcher.innerHTML = "";
    const row = h("div", "sw-row");
    (RECENTS.length ? RECENTS : ["phone", "safari", "music"]).forEach(id => {
      const def = IOS.app(id);
      if (!def) return;
      const ic = h("div", "sw-app",
        h("div", { class: "glyph", html: def.icon() }),
        h("div", "label", def.name));
      ic.addEventListener("click", () => { toggleSwitcher(); IOS.open(id); });
      row.append(ic);
    });
    const ctr = h("div", "sw-music",
      h("span", { html: Glyphs.prev(), onclick: () => Snd.click() }),
      h("span", { html: (typeof MusicPlayer !== "undefined" && MusicPlayer.playing) ? Glyphs.pause() : Glyphs.play(),
        onclick: e => {
          Snd.click();
          if (typeof MusicPlayer === "undefined") return;
          if (MusicPlayer.playing) { MusicPlayer.stop(); e.currentTarget.innerHTML = Glyphs.play(); }
          else { MusicPlayer.play(0, null, () => {}); e.currentTarget.innerHTML = Glyphs.pause(); }
        } }),
      h("span", { html: Glyphs.next(), onclick: () => Snd.click() }));
    switcher.append(ctr, row);
    switcher.classList.remove("hidden");
    swOpen = true;
  }

  /* Siri — hold the home button */
  const siri = h("div", { id: "siri", class: "hidden" });
  screen.append(siri);
  function openSiri() {
    siri.innerHTML = "";
    const answers = h("div", "siri-answers");
    const say = t => { answers.append(h("div", "siri-bubble", t)); answers.scrollTop = 1e6; };
    const RESP = [
      [/weather/i, "It is 73° and sunny in Cupertino. It is always 73° and sunny in Cupertino."],
      [/time/i, () => "It is " + fmtTime(new Date()) + ". Time is a rolling release."],
      [/call (\w+)/i, m => { const c = CONTACTS.find(x => contactName(x).toLowerCase().includes(m[1].toLowerCase())); return c ? "Calling " + contactName(c) + "…" : "I could not find that person."; }],
      [/arch|linux|kernel/i, "This device runs Linux " + NativeBridge.get("kernel", "6.9.7-arch1-1") + ". You were going to mention it eventually."],
      [/joke/i, "A partial upgrade walks into a bar. The bar segfaults."],
      [/love|marry/i, "I am a shell script with self-esteem. Let us keep this professional."],
      [/open (\w+)/i, m => { const id = Object.keys(IOS).length && m[1].toLowerCase(); return "OPEN:" + id; }]
    ];
    const field = kbField("Ask me anything…", {
      returnLabel: "Ask", blueReturn: true,
      onReturn: v => {
        if (!v.trim()) return;
        say("“" + v.trim() + "”");
        field.value = "";
        let out = "I am not sure I understand. Then again, it is 2012.";
        for (const [re, r] of RESP) {
          const m = v.match(re);
          if (m) { out = typeof r === "function" ? r(m) : r; break; }
        }
        if (out.startsWith("OPEN:")) {
          const id = out.slice(5);
          const def = IOS.app(id);
          if (def) { closeSiri(); return IOS.open(id); }
          out = "I do not have an app called “" + id + "”.";
        }
        setTimeout(() => say(out), 450);
        if (/call (\w+)/i.test(v)) {
          const m = v.match(/call (\w+)/i);
          const c = CONTACTS.find(x => contactName(x).toLowerCase().includes(m[1].toLowerCase()));
          if (c) setTimeout(() => { closeSiri(); IncomingCall.outgoing(contactName(c)); }, 1200);
        }
      }
    });
    siri.append(
      h("div", "siri-head", h("div", { class: "siri-mic", html: Glyphs.mute().replace(/M4 3.6 20 20.4/, "M0 0 0 0") }),
        h("div", null, "What can I help you with?")),
      answers,
      h("div", { style: { padding: "8px" } }, field),
      h("div", { class: "nc-grab", onclick: closeSiri }, h("i")));
    siri.classList.remove("hidden");
    Snd.tri();
  }
  function closeSiri() { KB.close(); siri.classList.add("hidden"); }

  // home button: double-press => switcher, long-press => Siri
  (() => {
    const hb = $id("home-btn");
    let lastUp = 0, downAt = 0, longFired = false;
    hb.addEventListener("pointerdown", () => {
      downAt = Date.now(); longFired = false;
      setTimeout(() => {
        if (downAt && Date.now() - downAt >= 700 && !longFired) { longFired = true; openSiri(); }
      }, 720);
    });
    hb.addEventListener("click", e => {
      const held = Date.now() - downAt;
      downAt = 0;
      if (longFired) { e.stopImmediatePropagation(); return; }
      if (ncOpen) closeNC();
      if (!siri.classList.contains("hidden")) closeSiri();
      const now = Date.now();
      if (now - lastUp < 450 && (IOS.state === "home" || IOS.state === "app")) {
        toggleSwitcher();
      } else if (swOpen) toggleSwitcher();
      lastUp = now;
    }, true);
  })();

  /* =============================================================
     Slide to power off (hold the power button)
     ============================================================= */
  const powerUI = h("div", { id: "power-off", class: "hidden" });
  screen.append(powerUI);
  function showPowerOff() {
    powerUI.innerHTML = "";
    const thumb = h("div", "po-thumb", h("span", { class: "gl", style: { width: "20px", height: "20px" }, html: Glyphs.bolt() }));
    const track = h("div", "po-track", thumb, h("div", "po-label", "slide to power off"));
    const cancel = h("button", "po-cancel", "Cancel");
    cancel.addEventListener("click", () => powerUI.classList.add("hidden"));
    powerUI.append(track, cancel);
    powerUI.classList.remove("hidden");
    let x0 = null, cur = 0;
    thumb.addEventListener("pointerdown", e => { x0 = e.clientX; thumb.setPointerCapture(e.pointerId); });
    thumb.addEventListener("pointermove", e => {
      if (x0 === null) return;
      cur = Math.max(0, Math.min(190, e.clientX - x0));
      thumb.style.transform = `translateX(${cur}px)`;
    });
    thumb.addEventListener("pointerup", async () => {
      x0 = null;
      if (cur > 160) {
        powerUI.classList.add("hidden");
        if (NativeBridge.active) {
          const r = await fetch("http://127.0.0.1:9641/power", { method: "POST",
            headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "poweroff" }) })
            .then(x => x.json()).catch(() => null);
          if (r && r.ok) return; // the machine is going away
        }
        // simulated: goodbye spinner then a cold reboot
        const off = h("div", { style: { position: "absolute", inset: 0, background: "#000", zIndex: 400,
          display: "flex", alignItems: "center", justifyContent: "center" } }, h("div", "boot-spinner"));
        screen.append(off);
        setTimeout(() => location.reload(), 1800);
      } else thumb.style.transform = "translateX(0)";
    });
  }
  (() => {
    const pb = $id("power-btn");
    let downAt = 0, longFired = false;
    pb.addEventListener("pointerdown", () => {
      downAt = Date.now(); longFired = false;
      setTimeout(() => {
        if (downAt && Date.now() - downAt >= 900 && !longFired &&
            IOS.state !== "off" && IOS.state !== "boot") { longFired = true; showPowerOff(); }
      }, 920);
    });
    pb.addEventListener("click", e => {
      downAt = 0;
      if (longFired) e.stopImmediatePropagation();
    }, true);
  })();

  /* =============================================================
     Passcode lock
     ============================================================= */
  const _unlock = IOS.unlock.bind(IOS);
  IOS.unlock = () => {
    const code = Prefs.get("passcode", "");
    if (!code) return _unlock();
    askPasscode("Enter Passcode", v => {
      if (v === code) { pcClose(); _unlock(); }
      else { Snd.lockSnd(); pcShake(); }
    });
  };
  let pcEl = null;
  function pcClose() { if (pcEl) { pcEl.remove(); pcEl = null; } }
  function pcShake() {
    const dots = pcEl.querySelector(".pc-dots");
    dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake");
    pcEl._entry = ""; pcPaint();
  }
  function pcPaint() {
    [...pcEl.querySelectorAll(".pc-dot")].forEach((d, i) => d.classList.toggle("full", i < pcEl._entry.length));
  }
  function askPasscode(title, onDone) {
    pcClose();
    pcEl = h("div", "pc-pad");
    pcEl._entry = "";
    const dots = h("div", "pc-dots", [0, 1, 2, 3].map(() => h("i", "pc-dot")));
    const grid = h("div", "pc-grid");
    "123456789 0⌫".split("").forEach(k => {
      if (k === " ") { grid.append(h("div")); return; }
      const b = h("div", "pc-key", k);
      b.addEventListener("click", () => {
        Snd.key();
        if (k === "⌫") pcEl._entry = pcEl._entry.slice(0, -1);
        else if (pcEl._entry.length < 4) pcEl._entry += k;
        pcPaint();
        if (pcEl._entry.length === 4) setTimeout(() => onDone(pcEl._entry), 120);
      });
      grid.append(b);
    });
    pcEl.append(h("div", "pc-title", title), dots, grid,
      h("button", { class: "po-cancel", onclick: () => { pcClose(); } }, "Cancel"),
      h("button", { class: "pc-emergency", onclick: () => {
        Snd.click();
        showAlert({ title: "Emergency Call", text: "Dial 112 / 911?", buttons: [
          { label: "Cancel" },
          { label: "Call", onTap: () => { pcClose(); IncomingCall.outgoing("Emergency — 112"); } }] });
      } }, "Emergency Call"));
    screen.append(pcEl);
  }
  // Settings hooks into this
  window.PasscodeUI = {
    enable(cb) {
      askPasscode("Set Passcode", first => {
        pcEl._entry = "";
        pcPaint();
        pcEl.querySelector(".pc-title").textContent = "Re-enter Passcode";
        const orig = pcEl;
        askPasscode("Re-enter Passcode", second => {
          if (first === second) { Prefs.set("passcode", first); pcClose(); cb && cb(true); }
          else { pcClose(); showAlert({ title: "Passcodes Did Not Match", text: "Try again." }); cb && cb(false); }
        });
      });
    },
    disable(cb) {
      askPasscode("Enter Passcode to Disable", v => {
        if (v === Prefs.get("passcode", "")) { Prefs.set("passcode", ""); pcClose(); cb && cb(true); }
        else pcShake();
      });
    }
  };

  /* =============================================================
     Spotlight (swipe right from the first page)
     ============================================================= */
  const spot = h("div", { id: "spotlight", class: "hidden" });
  screen.append(spot);
  function openSpotlight() {
    spot.innerHTML = "";
    const results = h("div", "spot-results");
    function search(q) {
      results.innerHTML = "";
      if (!q.trim()) return;
      const ql = q.toLowerCase();
      const add = (ico, label, sub, onTap) => {
        const r = h("div", "spot-row", h("div", { class: "nc-banner-ico", html: ico }),
          h("div", "nc-banner-txt", h("b", null, label), h("span", null, sub)));
        r.addEventListener("click", onTap);
        results.append(r);
      };
      // apps
      ["messages", "phone", "safari", "music", "settings", "notes", "maps", "obsidian", "lazyvim", "steps", "cydia", "terminal",
       "calendar", "photos", "camera", "clock", "calculator", "mail", "weather", "stocks", "appstore"]
        .filter(id => IOS.app(id) && IOS.app(id).name.toLowerCase().includes(ql))
        .forEach(id => add(IOS.app(id).icon(), IOS.app(id).name, "Application", () => { closeSpotlight(); IOS.open(id); }));
      // contacts
      CONTACTS.filter(c => contactName(c).toLowerCase().includes(ql))
        .forEach(c => add(IOS.app("contacts").icon(), contactName(c), c.phone, () => { closeSpotlight(); IOS.open("contacts"); }));
      // notes
      Prefs.get("notes", []).filter(n => (n.title + n.body).toLowerCase().includes(ql))
        .forEach(n => add(IOS.app("notes").icon(), n.title || "Note", "Note", () => { closeSpotlight(); IOS.open("notes"); }));
    }
    const field = kbField("Search iPhone", { returnLabel: "Search", blueReturn: true,
      onChange: search, onReturn: () => KB.close() });
    spot.append(h("div", { class: "searchbar" }, field), results);
    spot.classList.remove("hidden");
    setTimeout(() => KB.open(field), 60);
  }
  function closeSpotlight() { KB.close(); spot.classList.add("hidden"); }
  (() => {
    const home = $id("home");
    let x0 = null;
    home.addEventListener("pointerdown", e => { x0 = e.clientX; });
    home.addEventListener("pointerup", e => {
      const dots = [...document.querySelectorAll("#page-dots i")];
      const onFirst = dots.length && dots[0].classList.contains("on");
      if (x0 !== null && e.clientX - x0 > 70 && onFirst && IOS.state === "home") openSpotlight();
      x0 = null;
    });
    $id("home-btn").addEventListener("click", () => { if (!spot.classList.contains("hidden")) closeSpotlight(); });
  })();

  /* =============================================================
     Alarms that actually fire
     ============================================================= */
  let lastFired = "";
  setInterval(() => {
    const now = fmtTime(new Date());
    if (now === lastFired) return;
    const alarms = Prefs.get("alarms", []);
    const hit = alarms.find(a => a.on && a.time === now);
    if (!hit) return;
    lastFired = now;
    if (IOS.state === "asleep") $id("screen-off").click();
    const ring = setInterval(() => Snd.tri(), 1600);
    Snd.tri();
    const ov = h("div", "alarm-fire",
      h("div", "alarm-time", now),
      h("div", "alarm-label", hit.label || "Alarm"),
      h("button", { class: "big-blue-btn", style: { width: "200px" }, onclick: () => { clearInterval(ring); ov.remove(); } }, "OK"),
      h("button", { class: "po-cancel", onclick: () => {
        clearInterval(ring); ov.remove();
        // snooze: re-arm 9 minutes out
        const d = new Date(Date.now() + 9 * 60000);
        alarms.push({ time: fmtTime(d), label: (hit.label || "Alarm") + " (snoozed)", on: true, ephemeral: true });
        Prefs.set("alarms", alarms);
      } }, "Snooze"));
    screen.append(ov);
    Notify.push("clock", "Alarm", hit.label || now, { silent: true });
  }, 15000);

  /* =============================================================
     Incoming calls & texts
     ============================================================= */
  const IncomingCall = (() => {
    let ringIv = null, ui = null;
    function stop() { clearInterval(ringIv); ringIv = null; if (ui) { ui.remove(); ui = null; } }
    function inCallOverlay(name) {
      const stateEl = h("div", "call-state", "00:00");
      let secs = 0;
      const iv = setInterval(() => {
        secs++;
        stateEl.textContent = String(Math.floor(secs / 60)).padStart(2, "0") + ":" + String(secs % 60).padStart(2, "0");
      }, 1000);
      const scr = h("div", { class: "call-screen", style: { zIndex: 320 } },
        h("div", "call-name", name), stateEl,
        h("button", { class: "call-end", style: { marginTop: "60px" }, onclick: () => { clearInterval(iv); scr.remove(); Snd.lockSnd(); } }, "End"));
      screen.append(scr);
    }
    function show(name, number, { native = false, callId = null } = {}) {
      stop();
      if (window.DND && DND.active()) {
        // silenced: straight to the missed-call ledger, screen stays dark
        Notify.push("phone", name || number || "Unknown", "Missed Call · Do Not Disturb");
        typeof PhoneApp !== "undefined" && PhoneApp.addRecent({ name: name || number || "Unknown", time: fmtTime(new Date()), type: "missed" });
        return;
      }
      Snd.ringtone(); ringIv = setInterval(() => Snd.ringtone(), 2600);
      ui = h("div", { class: "call-screen", style: { zIndex: 320 } },
        h("div", "call-name", name || number || "Unknown"),
        h("div", "call-state", native ? "incoming call (modem)" : "incoming call"),
        h("div", { style: { display: "flex", gap: "14px", marginTop: "220px" } },
          h("button", { class: "call-end", style: { width: "126px", margin: 0 }, onclick: () => {
            stop();
            fetchCtl("hangup", callId);
            typeof PhoneApp !== "undefined" && PhoneApp.addRecent({ name: name || number || "Unknown", time: fmtTime(new Date()), type: "missed" });
          } }, "Decline"),
          h("button", { class: "call-end", style: { width: "126px", margin: 0,
            background: "linear-gradient(#b3e389,#529f22)", borderColor: "#2f6b12" }, onclick: () => {
            stop();
            fetchCtl("accept", callId);
            typeof PhoneApp !== "undefined" && PhoneApp.addRecent({ name: name || number || "Unknown", time: fmtTime(new Date()), type: "in" });
            inCallOverlay(name || number);
          } }, "Answer")));
      screen.append(ui);
      Notify.push("phone", "Incoming Call", name || number || "Unknown", { silent: true });
    }
    function fetchCtl(action, callId) {
      if (!callId || !NativeBridge.active) return;
      fetch("http://127.0.0.1:9641/call/" + action, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ call: callId }) }).catch(() => {});
    }
    function outgoing(name) { inCallOverlay(name); }
    return { show, outgoing, stop };
  })();

  function incomingTextSim() {
    const t = THREADS.find(x => x.contact === "zach");
    if (!t) return;
    const msg = { dir: "in", text: "You still owe me a charger btw" };
    t.msgs.push(msg); t.unread = true; t.time = fmtTime(new Date());
    Notify.push("messages", "Zach Wood", msg.text);
  }
  function incomingCallSim() {
    const c = contactById("kate");
    IncomingCall.show(contactName(c), c.phone);
  }
  // one of each per session, when simulating
  setTimeout(() => { if (!NativeBridge.active && IOS.state !== "off" && IOS.state !== "boot") incomingTextSim(); }, 150000);
  setTimeout(() => { if (!NativeBridge.active && IOS.state !== "off" && IOS.state !== "boot") incomingCallSim(); }, 240000);

  // hardware: poll the modem for ringing calls and fresh SMS
  let ringSeen = "";
  setInterval(async () => {
    if (!NativeBridge.active) return;
    const ringing = NativeBridge.get("modem.ringing", null);
    if (ringing && ringing.id !== ringSeen) {
      ringSeen = ringing.id;
      const c = contactByNumber(ringing.number || "");
      IncomingCall.show(c ? contactName(c) : null, ringing.number, { native: true, callId: ringing.id });
    }
    try {
      const r = await fetch("http://127.0.0.1:9641/sms/list").then(x => x.json());
      (r.new || []).forEach(m => {
        const c = contactByNumber(m.number || "");
        const t = c && THREADS.find(x => x.contact === c.id);
        if (t) { t.msgs.push({ dir: "in", text: m.text }); t.unread = true; t.time = fmtTime(new Date()); }
        Notify.push("messages", c ? contactName(c) : (m.number || "Message"), m.text);
      });
    } catch (e) { /* endpoint optional */ }
  }, 8000);

  /* =============================================================
     Auto-lock + battery warnings
     ============================================================= */
  let lastActivity = Date.now();
  ["pointerdown", "keydown"].forEach(ev => screen.addEventListener(ev, () => { lastActivity = Date.now(); }, true));
  setInterval(() => {
    const mins = Prefs.get("autolock", 0);
    if (!mins || IOS.state === "asleep" || IOS.state === "off" || IOS.state === "boot") return;
    if (Date.now() - lastActivity > mins * 60000) $id("power-btn").click();
  }, 20000);

  let battWarned = false;
  setInterval(() => {
    const pct = NativeBridge.get("battery.pct", null);
    if (pct !== null && pct <= 20 && !battWarned) {
      battWarned = true;
      showAlert({ title: "20% Battery Remaining", text: "You can change this warning in no way whatsoever." });
    }
    if (pct !== null && pct > 30) battWarned = false;
  }, 30000);

  /* test hooks (used by the automated test-suite) */
  window.__ios6sim = {
    incomingText: incomingTextSim,
    incomingCall: incomingCallSim,
    notify: (a, t, x) => Notify.push(a, t, x),
    openNC, openSpotlight, toggleSwitcher, showPowerOff, openSiri
  };

  return { Notify, IncomingCall };
})();

const Notify = ShellX.Notify;
const IncomingCall = ShellX.IncomingCall;

</script>
<script>
/* ===================================================================
   iOS 6 · Arch Edition — boot sequence
   The part everyone came for: the Arch kernel bringing up SpringBoard.
   =================================================================== */
"use strict";

const BOOT_LOG = [
  ["arch", ":: Arch Linux (iphone-flavoured) — kernel 6.9.7-arch1-1"],
  ["", "Booting Linux on physical CPU 0x0 [A6 'Swift' rev 1]"],
  ["", "Linux version 6.9.7-arch1-1 (build@archiso) (gcc 14.1.1, GNU ld 2.42) #1 SMP PREEMPT_DYNAMIC"],
  ["", "Machine model: Apple iPhone 5 (ARCH1,6)"],
  ["", "Memory: 1024MB available (912k kernel code, 8188k reserved)"],
  ["", "random: crng init done"],
  ["ok", "Mounted /boot."],
  ["", ":: running early hook [udev]"],
  ["", ":: running hook [udev]"],
  ["", ":: Triggering uevents..."],
  ["", "usbcore: registered new interface driver lightning"],
  ["", "retina: framebuffer at 0x5f700000, 640x1136, 32bpp"],
  ["", "input: home-button as /devices/platform/soc/gpio/input0"],
  ["", "input: multitouch as /devices/platform/soc/spi1/input1"],
  ["ok", "Reached target Local File Systems."],
  ["ok", "Started udev Kernel Device Manager."],
  ["", "baseband: qualcomm mdm9615 up, IMEI redacted (nice try)"],
  ["ok", "Started Network Manager."],
  ["ok", "Reached target Sound Card."],
  ["warn", "systemd[1]: /usr/lib/systemd/system/skeuomorphism.service: unit is deprecated upstream, keeping anyway"],
  ["ok", "Started Skeuomorphic Texture Daemon (linen, felt, leather)."],
  ["ok", "Started CoreAnimation Compositor."],
  ["", "pacman: 0 packages to upgrade — system is btw up to date"],
  ["ok", "Reached target Graphical Interface."],
  ["arch", "Welcome to Arch Linux!"],
  ["", ""],
  ["", "arch-iphone login: springboard (automatic login)"],
  ["", "Starting SpringBoard 6.1.3 ..."]
];

(function bootSystem() {
  const bootEl = $id("boot");
  const logEl = $id("boot-log");
  const appleEl = $id("boot-apple");
  let started = false;

  function runBoot() {
    if (started) return;
    started = true;
    Snd.unlock(); // prime audio context on this user gesture
    IOS.state = "boot";
    let i = 0;
    const next = () => {
      if (i >= BOOT_LOG.length) return finishLog();
      const [cls, text] = BOOT_LOG[i++];
      const line = document.createElement("div");
      if (cls === "ok") {
        line.innerHTML = '<span class="ok">[  OK  ]</span> ' + text;
      } else if (cls === "warn") {
        line.innerHTML = '<span class="warn">[ WARN ]</span> ' + text;
      } else if (cls === "arch") {
        line.className = "arch";
        line.textContent = text;
      } else {
        line.textContent = text;
      }
      logEl.append(line);
      logEl.scrollTop = logEl.scrollHeight;
      setTimeout(next, 40 + Math.random() * 110);
    };
    setTimeout(next, 350);

    function finishLog() {
      const toLock = () => {
        bootEl.classList.add("hidden");
        IOS.applyWallpaper();
        IOS.applyBrightness();
        IOS.refreshSignal();
        IOS.tick();
        $id("keyboard").classList.toggle("kb-dark", Prefs.get("kbdark", false));
        IOS.showLock();
      };
      if (Prefs.get("verboseboot", false)) {
        // Cydia's "Verbose Boot" tweak: no fruit, straight from log to lock
        setTimeout(toLock, 700);
      } else {
        setTimeout(() => {
          appleEl.classList.remove("hidden");
          setTimeout(toLock, 2400);
        }, 500);
      }
    }
  }

  bootEl.addEventListener("click", runBoot);
  // also boot on first click anywhere on the (off) screen
  setTimeout(() => { $id("hint").textContent = "click the screen to power on · drag the slider to unlock · home button returns home"; }, 100);
})();

</script>
