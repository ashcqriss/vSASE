}
.saf-tabrow {

.saf-start { padding: 40px 30px; text-align: center; color: #6c7686; }
.saf-start .bookmark-tile {

/* ================= Calendar ================= */

.cal-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: linear-gradient(#eceef1, #d4d8de);
  border-bottom: 1px solid #b3b8c0;
  font-size: 11px; font-weight: bold; color: #4d5563; text-align: center;
  padding: 3px 0;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 44px; background: #eef0f3; }
.cal-day {
  border-right: 1px solid #cdd1d8; border-bottom: 1px solid #cdd1d8;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 16px; font-weight: bold; color: #333;
  cursor: pointer; position: relative;
}
.cal-day.dim { color: #b3b8c1; background: #e4e7eb; }
.cal-day.sel { background: linear-gradient(#7c9ff0, #2f5bd4); color: #fff; }
.cal-day.today:not(.sel) { background: linear-gradient(#8d97a8, #6e7a8e); color: #fff; }
.cal-day .dot { width: 5px; height: 5px; border-radius: 50%; background: #5b6b85; position: absolute; bottom: 4px; }
.cal-day.sel .dot { background: #fff; }
.cal-events { flex: 1; overflow-y: auto; border-top: 2px solid #9aa2af; }
.cal-ev { display: flex; gap: 10px; padding: 9px 12px; border-bottom: 1px solid #e2e4e8; }
.cal-ev-time { font-size: 12px; font-weight: bold; color: #55607a; width: 62px; flex: 0 0 62px; }
.cal-ev-name { font-size: 14px; font-weight: bold; }
.cal-month-title { display: flex; align-items: center; gap: 14px; }
.cal-month-title b { font-size: 20px; color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.4); }
.cal-arrow { color: #dfe6f2; font-size: 18px; cursor: pointer; padding: 4px 8px; }

/* ================= Weather ================= */

.weather-root {
  background: linear-gradient(#3e7fc4 0%, #2a5f9e 40%, #1d4573 100%) !important;
  color: #fff;
}
.wx-city { text-align: center; font-size: 22px; font-weight: bold; margin-top: 16px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.wx-cond { text-align: center; font-size: 14px; color: #cfe2f7; }
.wx-now { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 10px; }
.wx-big { font-size: 64px; font-weight: 200; text-shadow: 0 2px 3px rgba(0,0,0,.35); }
.wx-icon-big { font-size: 46px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.wx-hl { text-align: center; font-size: 14px; color: #d8e8fb; margin-bottom: 12px; }
.wx-week { margin: 0 12px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.35); }
.wx-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.06));
  border-bottom: 1px solid rgba(255,255,255,.22);
  font-size: 15px; font-weight: bold;
  text-shadow: 0 1px 1px rgba(0,0,0,.35);
}
.wx-row:last-child { border-bottom: none; }
.wx-row .d { flex: 1; }
.wx-row .lo { color: #b9d2ef; font-weight: normal; }
.wx-foot { text-align: center; margin-top: 14px; font-size: 11px; color: #9dbede; padding: 0 14px; }
.wx-viewport { flex: 1; overflow: hidden; }
.wx-pages { display: flex; height: 100%; transition: transform .3s cubic-bezier(.25,.6,.3,1); touch-action: none; }
.wx-page { flex: 0 0 320px; overflow-y: auto; padding-bottom: 8px; }

/* ================= Notes ================= */

.notes-root .navbar {
  background: linear-gradient(#8a7a5a, #6e5f43 50%, #5d4f36 51%, #6a5c40);
  border-bottom-color: #3c3320;
}
.notes-root .nav-btn { background: linear-gradient(#7d6e50, #57492f); border-color: #3c3320; }
.note-paper {
  flex: 1; overflow-y: auto;
  background:
    linear-gradient(#f8f2ba0d, transparent 2px),
    repeating-linear-gradient(transparent 0 27px, #d9c98f 27px 28px),
    linear-gradient(#fdf7c9, #f7efb2);
  padding: 4px 14px 20px;
  font-family: "Marker Felt", "Segoe Print", "Comic Sans MS", cursive;
  font-size: 17px; line-height: 28px; color: #3a3427;
  white-space: pre-wrap;
  -webkit-user-select: text; user-select: text;

}
.notes-list-paper { background: repeating-linear-gradient(transparent 0 43px, #e0d5a8 43px 44px), linear-gradient(#fdf7c9, #f7efb2); }
.notes-list-paper .cell { background: transparent; border-bottom: none; font-family: "Marker Felt", "Segoe Print", "Comic Sans MS", cursive; }

/* ================= Reminders ================= */

.rem-paper { flex: 1; overflow-y: auto; background: repeating-linear-gradient(transparent 0 43px, #d8dade 43px 44px), #fff; }
.rem-row { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; }
.rem-check {
  width: 21px; height: 21px; flex: 0 0 21px;
  border: 1px solid #a6aab2; border-radius: 4px;
  background: linear-gradient(#fff, #e3e6ea);
  display: flex; align-items: center; justify-content: center;
  color: #d9534f; font-weight: bold; cursor: pointer; font-size: 15px;
}
.rem-text { font-size: 16px; font-weight: 500; }
.rem-text.done { color: #9aa0a8; text-decoration: line-through; }

/* ================= Clock ================= */

.clock-root { background: #1c1c1e !important; }
.clock-root .content { background: #26262a; }
.wc-row {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid #3a3a3f;
  color: #fff;
}
.wc-info { flex: 1; }
.wc-city { font-size: 19px; font-weight: bold; }
.wc-sub { font-size: 12px; color: #97979d; }
.wc-digital { font-size: 30px; font-weight: 200; }
.sw-face {
  text-align: center; font-size: 56px; font-weight: 200; color: #fff;
  padding: 26px 0 10px; font-variant-numeric: tabular-nums;
}
.sw-btns { display: flex; justify-content: space-around; padding: 8px 20px 16px; }
.sw-btn {
  width: 74px; height: 74px; border-radius: 50%;
  border: 2px solid #55555c;
  background: radial-gradient(circle at 50% 35%, #48484f, #232327 75%);
  color: #fff; font-size: 14px; font-weight: bold; font-family: inherit;
  cursor: pointer;
}
.sw-btn.green { color: #6fd76f; }
.sw-btn.red { color: #ff6b62; }
.sw-laps { border-top: 1px solid #3a3a3f; }
.sw-laps .wc-row { padding: 8px 16px; font-variant-numeric: tabular-nums; }
.timer-face { text-align: center; font-size: 52px; font-weight: 200; color: #fff; padding: 22px 0 6px; font-variant-numeric: tabular-nums; }
.timer-set { display: flex; justify-content: center; gap: 10px; padding: 8px; }
.timer-set select {
  background: #303036; color: #fff; border: 1px solid #55555c; border-radius: 6px;
  font-size: 16px; padding: 5px 7px; font-family: inherit;
}

/* ================= Calculator ================= */

.calc-root { background: #1f2126 !important; }
.calc-display {
  flex: 0 0 96px;
  background: linear-gradient(#2b2e34, #16181c);
  display: flex; align-items: flex-end; justify-content: flex-end;
  padding: 8px 14px;
  color: #fff; font-size: 52px; font-weight: 200;
  overflow: hidden;
  border-bottom: 1px solid #000;
  text-shadow: 0 1px 3px rgba(0,0,0,.7);
}
.calc-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #0a0b0d; padding: 1px; }
.calc-btn {
  border: none; font-size: 24px; font-weight: 400; font-family: inherit;
  color: #fff; cursor: pointer;
  background: linear-gradient(#7e838c, #545962 50%, #43474f 51%, #4e535b);
  text-shadow: 0 -1px 0 rgba(0,0,0,.5);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
}
.calc-btn.dark { background: linear-gradient(#585d66, #3a3e45 50%, #2c2f35 51%, #35383e); }
.calc-btn.op { background: linear-gradient(#fbb96b, #f5871f 50%, #e06e00 51%, #ef7f0e); font-size: 28px; }
.calc-btn.op.hl { background: linear-gradient(#fff, #ffd9ad); color: #e06e00; text-shadow: none; }
.calc-btn:active { filter: brightness(.75); }
.calc-btn.zero { grid-column: span 2; }

/* ================= Stocks ================= */

.stocks-root { background: #101014 !important; }
.stk-row {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid #2c2c32;
  color: #fff; cursor: pointer;
}
.stk-sym { flex: 1; }
.stk-sym b { font-size: 17px; display: block; }
.stk-sym span { font-size: 11px; color: #8b8b92; }
.stk-price { font-size: 17px; font-weight: bold; margin-right: 6px; }
.stk-chg {
  width: 72px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: bold; color: #fff;
}
.stk-chg.up { background: linear-gradient(#61c951, #2f9a1f); }
.stk-chg.down { background: linear-gradient(#e0574b, #b7271b); }
.stk-chart-wrap { padding: 10px; }
.stk-chart-wrap canvas { width: 100%; border-radius: 8px; background: #17171c; }
.stk-foot { text-align: center; color: #6c6c74; font-size: 11px; padding: 8px; }

/* ================= Maps ================= */

.maps-root { background: #e9e2cf !important; }
.maps-canvas { flex: 1; position: relative; overflow: hidden; background: #f2ecdb; }
.maps-canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.maps-pin {
  position: absolute; width: 20px; height: 30px; margin: -30px 0 0 -10px;
  pointer-events: none;
  animation: pindrop .4s ease-in;
}
@keyframes pindrop { from { transform: translateY(-80px); } to { transform: none; } }
.maps-dot {
  position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #7cb1f5, #1d5fd0);
  border: 2.5px solid #fff;
  box-shadow: 0 1px 5px rgba(0,0,0,.5);
}
.maps-dot::after {
  content: ""; position: absolute; inset: -11px;
  border-radius: 50%;
  border: 2px solid rgba(60,130,240,.55);
  animation: pulse 2s ease-out infinite;
}
@keyframes pulse { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
.maps-banner {
  position: absolute; top: 8px; left: 8px; right: 8px; z-index: 6;
  border-radius: 8px;
  border: 1px solid #0d4d1e;
  background: linear-gradient(#2f9e4f, #1c7a37 55%, #146329);
  color: #fff; padding: 7px 12px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,.4);
  text-shadow: 0 -1px 0 rgba(0,0,0,.35);
}
.maps-banner .mb-arrow { font-size: 26px; font-weight: bold; display: flex; }
.maps-banner .mb-arrow svg { width: 27px; height: 27px; }
.maps-banner .mb-dist { font-size: 22px; font-weight: bold; line-height: 1.05; }
.maps-banner .mb-instr { font-size: 11px; font-weight: bold; letter-spacing: .03em; }
.maps-curl {
  position: absolute; right: 0; bottom: 0; width: 56px; height: 56px;
  background: linear-gradient(315deg, #b9b29b 0%, #ded8c2 45%, #fffdf2 50%, transparent 52%);
  border-top-left-radius: 70%;
  box-shadow: -3px -3px 6px rgba(0,0,0,.15);
  pointer-events: none;
}
.maps-loc-btn {
  position: absolute; left: 8px; bottom: 8px; z-index: 6;
  width: 42px; height: 34px;
  border: 1px solid #7c8ba0; border-radius: 7px;
  background: linear-gradient(#fdfdfd, #cfd5dd);
  font-size: 17px; color: #7a4dbb;
  cursor: pointer;
}

/* ================= Photos / Camera ================= */

.photo-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 2px;
  background: #000;
}
.photo-grid img { width: 100%; height: 78px; object-fit: cover; display: block; cursor: pointer; }
.photo-viewer {
  position: absolute; inset: 0; z-index: 30; background: #000;
  display: flex; align-items: center; justify-content: center;
}
.photo-viewer img { max-width: 100%; max-height: 100%; }
.cam-finder { flex: 1; position: relative; overflow: hidden; background: #000; }
.cam-zoomwrap {
  position: absolute; inset: 0;
  transform-origin: 50% 50%;
  transition: transform .15s ease-out;
}
.cam-scene { position: absolute; inset: 0; }

/* tap-to-focus reticle: blinks in oversized, settles, fades */
.cam-reticle {
  position: absolute; width: 60px; height: 60px; z-index: 6;
  border: 1px solid #f4d24a;
  box-shadow: 0 0 6px rgba(0,0,0,.5), inset 0 0 4px rgba(0,0,0,.3);
  pointer-events: none; opacity: 0;
}
.cam-reticle.focusing { animation: camfocus 1s ease-out; }
@keyframes camfocus {
  0% { opacity: 1; transform: scale(1.45); }
  30% { transform: scale(1); }
  45% { opacity: .35; }
  60% { opacity: 1; }
  100% { opacity: 1; transform: scale(1); }
}

/* rule-of-thirds grid */
.cam-grid {
  position: absolute; inset: 0; z-index: 4; pointer-events: none;
  background-image:
    linear-gradient(90deg, transparent calc(33.33% - .5px), rgba(255,255,255,.5) calc(33.33% - .5px) calc(33.33% + .5px), transparent calc(33.33% + .5px)),
    linear-gradient(90deg, transparent calc(66.66% - .5px), rgba(255,255,255,.5) calc(66.66% - .5px) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
    linear-gradient(0deg, transparent calc(33.33% - .5px), rgba(255,255,255,.5) calc(33.33% - .5px) calc(33.33% + .5px), transparent calc(33.33% + .5px)),
    linear-gradient(0deg, transparent calc(66.66% - .5px), rgba(255,255,255,.5) calc(66.66% - .5px) calc(66.66% + .5px), transparent calc(66.66% + .5px));
}

/* top chrome */
.cam-topbar {
  flex: 0 0 34px; z-index: 7;
  background: linear-gradient(#3b3e45, #17181c);
  border-bottom: 1px solid #000;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px;
}
.cam-top-btn {
  height: 24px; padding: 0 11px;
  border-radius: 12px; border: 1px solid #0a0a0c;
  background: linear-gradient(#55585f, #26282d);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
  color: #e6eaf0; font-size: 12px; font-weight: bold; font-family: inherit;
  text-shadow: 0 -1px 0 rgba(0,0,0,.6);
  cursor: pointer;
}
.cam-top-btn.lit { background: linear-gradient(#f4cf5a, #c8951d); color: #2c2004; text-shadow: 0 1px 0 rgba(255,255,255,.35); border-color: #7a5c10; }
.cam-options {
  position: absolute; top: 54px; left: 50%; transform: translateX(-50%);
  z-index: 20; width: 190px;
  background: rgba(20,22,27,.94);
  border: 1px solid rgba(255,255,255,.25); border-radius: 10px;
  padding: 8px 12px;
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,.6);
}
.cam-opt-row {
  display: flex; align-items: center; justify-content: space-between;
  color: #fff; font-size: 14px; font-weight: bold;
  text-shadow: 0 -1px 0 #000;
}

/* digital zoom slider */
.cam-zoom {
  position: absolute; left: 24px; right: 24px; bottom: 12px; z-index: 8;
  display: flex; align-items: center; gap: 10px;
  background: rgba(15,16,20,.62);
  border: 1px solid rgba(255,255,255,.3); border-radius: 14px;
  padding: 4px 12px;
  color: #fff; font-size: 15px; font-weight: bold;
  opacity: .4; transition: opacity .25s;
}
.cam-zoom.active, .cam-zoom:hover { opacity: 1; }
.cam-zoom input { flex: 1; }

/* screen flash */
.cam-flashfx {
  position: absolute; inset: 0; z-index: 9;
  background: #fff; opacity: 0; pointer-events: none;
  transition: opacity .12s ease-out;
}
.cam-flashfx.fire { opacity: 1; }

.cam-hdr-badge {
  position: absolute; top: 8px; left: 8px; z-index: 6;
  background: rgba(0,0,0,.55); border-radius: 4px;
  padding: 2px 7px;
  color: #f4d24a; font-size: 11px; font-weight: bold;
}
.cam-bar {
  flex: 0 0 62px;
  background: linear-gradient(#3b3e45, #17181c);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
}
.cam-shutter {
  width: 78px; height: 42px;
  border-radius: 9px;
  border: 1px solid #0d3d63;
  background: linear-gradient(#7db8e8, #2d7cbf 50%, #16639f 51%, #2273b2);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; cursor: pointer;
  color: #eaf4ff;
}
.cam-thumb { width: 40px; height: 40px; border: 1px solid #666; border-radius: 5px; overflow: hidden; background: #222; }
.cam-thumb img { width: 100%; height: 100%; object-fit: cover; }
.cam-flip { color: #dde3ea; font-size: 20px; cursor: pointer; }
.cam-finder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam-mode {
  width: 58px; height: 20px; border-radius: 11px;
  border: 1px solid #111;
  background: linear-gradient(#2c2f35, #17181c);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 6px; cursor: pointer;
  position: relative;
}
.cam-mode svg { width: 13px; height: 13px; }
.cam-mode .cm-still { color: #dfe4ea; }
.cam-mode .cm-vid { color: #6b7280; }
.cam-mode.video .cm-still { color: #6b7280; }
.cam-mode.video .cm-vid { color: #e0574b; }
.cam-shutter.rec { background: linear-gradient(#5b5f68, #2e3036); border-color: #111; }
.cam-recbtn {
  display: block; width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff8078, #c41e16);
}
.cam-recdot {
  position: absolute; top: 8px; right: 8px; z-index: 6;
  display: flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,.55); border-radius: 10px;
  padding: 2px 9px;
  color: #fff; font-size: 12px; font-weight: bold; font-variant-numeric: tabular-nums;
}
.cam-recdot i {
  width: 9px; height: 9px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff8078, #c41e16);
  animation: recblink 1s infinite;
}
.cam-iris {
  position: absolute; inset: 0; z-index: 5; background: #000;
  clip-path: circle(75% at 50% 50%);
  transition: clip-path .28s ease-in;
  pointer-events: none; opacity: 0;
}
.cam-iris.snap { opacity: 1; clip-path: circle(0% at 50% 50%); }

/* ================= Music ================= */

.music-np {
  flex: 1;
  background: linear-gradient(#2f333c, #14161b);
  display: flex; flex-direction: column; align-items: center;
  padding-top: 14px;
  color: #fff;
}
.music-art {
  width: 232px; height: 232px; border-radius: 4px;

  position: relative; overflow: hidden;
}
.music-track { margin-top: 12px; text-align: center; }
.music-track b { font-size: 16px; display: block; }
.music-track span { font-size: 13px; color: #a6adb8; }

.music-ctrls { display: flex; align-items: center; gap: 38px; margin-top: 14px; font-size: 30px; }

.music-vol { width: 250px; margin-top: 12px; }

/* ================= Videos / iTunes / App Store ================= */

.store-hero {
  padding: 16px;
  background: linear-gradient(#4a5568, #2c3442);
  color: #fff;
}
.store-hero h2 { font-size: 20px; margin-bottom: 4px; }
.store-hero p { font-size: 12px; color: #b8c2d2; font-weight: normal; }
.store-row { display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #e0e2e6; align-items: center; cursor: pointer; }
.store-app-ico {
  width: 50px; height: 50px; border-radius: 10px; flex: 0 0 50px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; color: #fff;

}
.store-info { flex: 1; min-width: 0; }
.store-info b { font-size: 15px; display: block; }
.store-info span { font-size: 12px; color: #79818c; font-weight: normal; }
.store-price {
  border: 1px solid #7c8ba0; border-radius: 5px;

.stars { color: #8b93a1; font-size: 11px; letter-spacing: 1px; }
.stars b { color: #f5a623; }

/* ================= Game Center ================= */

.gc-root {
  background:
    radial-gradient(70px 70px at 18% 20%, rgba(255,90,90,.75), rgba(255,90,90,0) 70%),
    radial-gradient(90px 90px at 78% 14%, rgba(90,140,255,.75), rgba(90,140,255,0) 70%),
    radial-gradient(80px 80px at 62% 42%, rgba(120,220,90,.7), rgba(120,220,90,0) 70%),
    radial-gradient(70px 70px at 25% 55%, rgba(250,210,70,.75), rgba(250,210,70,0) 70%),
    radial-gradient(90px 90px at 80% 70%, rgba(200,90,230,.65), rgba(200,90,230,0) 70%),
    linear-gradient(#e9e4d5, #d6cfba) !important;
}
.gc-card {
  margin: 22px 18px; padding: 18px;
  background: linear-gradient(#f6f1e2, #e3dcc6);

  box-shadow: 0 4px 12px rgba(0,0,0,.3);
  text-align: center;
}
.gc-card h2 { font-size: 22px; color: #4a4230; }
.gc-card .gc-nick { font-size: 13px; color: #877c5e; margin-bottom: 12px; }
.gc-stats { display: flex; justify-content: space-around; margin-top: 10px; }
.gc-stats b { display: block; font-size: 22px; color: #3f3a2b; }
.gc-stats span { font-size: 11px; color: #877c5e; }

/* ================= Passbook ================= */

.pb-root { background: #3b3f47 !important; }
.pass {
  margin: 12px 14px; border-radius: 12px; overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,.45);
  color: #fff; cursor: pointer;
}
.pass .p-top { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
.pass .p-top b { font-size: 16px; }
.pass .p-big { padding: 4px 14px 14px; font-size: 26px; font-weight: 200; }
.pass .p-barcode {
  margin: 0 14px 14px; height: 52px; border-radius: 5px;
  background: repeating-linear-gradient(90deg, #111 0 2px, #fff 2px 5px, #111 5px 6px, #fff 6px 10px);
}

/* ================= Newsstand ================= */

.ns-root { background: linear-gradient(#8a6a48, #6b4e30) !important; }
.ns-shelf {
  height: 118px; margin: 10px 8px 0;
  background: linear-gradient(#a8815c, #7d5c3a 80%, #5d4128);
  border-radius: 6px;
  box-shadow: inset 0 -10px 16px rgba(0,0,0,.45), 0 3px 5px rgba(0,0,0,.4);
  display: flex; align-items: flex-end; justify-content: flex-start;
  gap: 10px; padding: 0 14px 6px;
}
.ns-mag {
  width: 66px; height: 92px; border-radius: 2px;
  box-shadow: 0 2px 4px rgba(0,0,0,.55);
  color: #fff; font-size: 10px; font-weight: bold;
  padding: 6px; text-shadow: 0 1px 1px rgba(0,0,0,.5);
}

/* ================= Voice Memos ================= */

.vm-root { background: linear-gradient(#3a3d44, #17181c) !important; }
.vm-mic {
  flex: 1; display: flex; align-items: center; justify-content: center;
}
.vm-mic-svg { filter: drop-shadow(0 6px 14px rgba(0,0,0,.6)); }
.vm-ctrl {
  flex: 0 0 64px;
  background: linear-gradient(#4a4e57, #23252b);
  border-top: 1px solid #000;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
}
.vm-rec {
  width: 56px; height: 40px; border-radius: 8px;
  border: 1px solid #111;
  background: linear-gradient(#5b5f68, #2e3036);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.vm-rec i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8078, #c41e16); }
.vm-rec.recording i { border-radius: 3px; animation: recblink 1s infinite; }
@keyframes recblink { 50% { opacity: .4; } }
.vm-level {
  flex: 1; margin: 0 14px; height: 26px; border-radius: 5px;
  background: #101114; overflow: hidden;
  display: flex; align-items: center; gap: 2px; padding: 0 4px;
}
.vm-level i { width: 4px; height: 4px; background: #2f9a1f; transition: height .1s; }
.vm-time { color: #fff; font-size: 15px; font-variant-numeric: tabular-nums; }

/* ================= Compass ================= */

.comp-root { background: radial-gradient(circle at 50% 35%, #3b3e45, #101114 75%) !important; }
.comp-rose {
  margin: 30px auto 0; width: 250px; height: 250px;
  transition: transform .5s ease-out;
}
.comp-heading { text-align: center; color: #fff; font-size: 34px; font-weight: 200; margin-top: 18px; }
.comp-sub { text-align: center; color: #8b919c; font-size: 13px; }

/* ================= Terminal ================= */

.term-root { background: #0c0c0c !important; }
.term-out {
  flex: 1; overflow-y: auto;
  padding: 8px;
  font: 11px/1.45 "Menlo", "DejaVu Sans Mono", monospace;
  color: #d0d0d0;
  white-space: pre-wrap; word-break: break-word;
  -webkit-user-select: text; user-select: text;
  cursor: text;
}
.term-out .t-arch { color: #1793d1; font-weight: bold; }
.term-out .t-ok { color: #57e389; }
.term-out .t-prompt { color: #57e389; font-weight: bold; }
.term-out .t-cmd { color: #fff; }
.term-caret { display: inline-block; width: 7px; height: 11px; background: #d0d0d0; vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }

/* ================= Settings extras ================= */

.about-logo { text-align: center; padding: 6px 0 2px; font-size: 34px; color: #4c566c; }
.wp-thumb {
  width: 62px; height: 92px; border-radius: 6px; border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.4);
  cursor: pointer; flex: 0 0 62px;
}
.wp-thumb.sel { outline: 3px solid #2f6fd0; }
.wp-row { display: flex; gap: 12px; padding: 12px; }

/* ================= App Store installs & wiggle mode ================= */

.store-price.installed { color: #2f8a1f; border-color: #4a8a3a; }

#pages.editing .sb-icon .glyph-wrap { animation: wiggle .28s ease-in-out infinite alternate; }
#pages.editing .sb-icon:nth-child(2n) .glyph-wrap { animation-delay: .09s; }
#pages.editing .sb-icon:nth-child(3n) .glyph-wrap { animation-delay: .17s; }
@keyframes wiggle {
  from { transform: rotate(-2.6deg); }
  to   { transform: rotate(2.6deg); }
}
.sb-remove {
  position: absolute; top: -7px; left: -7px; z-index: 4;
  width: 20px; height: 20px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #6a6f78, #2c2f35 70%);
  border: 1.5px solid #fff;
  color: #fff; font-size: 11px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.6);
}

/* ================= Cydia ================= */

.cydia-root .navbar.dark {
  background: linear-gradient(#8a6b4a, #5d452c 50%, #4a3520 51%, #57402a);
  border-bottom-color: #2c1f10;
}
.cydia-root .content.grouped { background: #ded5c2; background-image: linear-gradient(90deg, rgba(255,255,255,.3) 1px, transparent 1px); background-size: 7px 100%; }
.cydia-hero {
  display: flex; gap: 12px; align-items: center;
  background: linear-gradient(#f4ecd8, #e2d5b8);
  border: 1px solid #a8946e; border-radius: 10px;
  padding: 12px; margin-bottom: 12px;
}
.cydia-hero-ico { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.cydia-hero-ico svg { width: 100%; height: 100%; display: block; }
.cydia-hero b { font-size: 17px; color: #3d2f1a; }
.cydia-sub { font-size: 12px; color: #7a6a4a; }

/* ================= Chirper ================= */

.chirp { padding: 10px 12px; border-bottom: 1px solid #e0e4e8; }
.chirp b { font-size: 14px; color: #1a6aa8; }
.chirp span { font-size: 12px; color: #8a919b; }
.chirp p { font-size: 14px; margin-top: 3px; font-weight: 400; }

/* ================= Dark keyboard (Cydia tweak) ================= */

#keyboard.kb-dark { background: linear-gradient(#3a3d44, #202329); border-top-color: #000; }

#keyboard.kb-dark .kb-key.return.blue { background: linear-gradient(#7c9ff0, #2f5bd4); }
#keyboard.kb-dark .kb-key:active { background: linear-gradient(#9fb4e8, #6f8fd8); color: #000; }

/* ================= misc wave-two bits ================= */

.msg-del {
  width: 22px; height: 22px; flex: 0 0 22px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff6b62, #c41e16);
  border: 1px solid #8a120c;
  color: #fff; font-size: 17px; font-weight: bold; line-height: 20px;
  text-align: center; cursor: pointer;
}
.ft-self {
  width: 110px; height: 146px; border-radius: 8px;
  border: 2px solid rgba(255,255,255,.6);
  object-fit: cover; background: #111;
  margin-top: 26px; display: none;
}
.ft-self.live { display: block; }
.pv-trash {
  position: absolute; bottom: 14px; right: 14px; z-index: 5;
  width: 44px; height: 34px; border-radius: 8px;
  background: linear-gradient(rgba(90,100,115,.9), rgba(40,46,58,.9));
  border: 1px solid #111;
  color: #fff; display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.pv-trash svg { width: 18px; height: 18px; }

/* ================= Notification Center, banners, switcher ================= */

.nc-banner {
  position: absolute; top: 20px; left: 4px; right: 4px; z-index: 260;
  display: flex; gap: 8px; align-items: center;
  background: linear-gradient(#4a505c, #2a2e38);
  background-image:
    radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(#4a505c, #2a2e38);
  background-size: 3px 3px, 100% 100%;
  border-bottom: 1px solid #12141a;
  border-radius: 0 0 8px 8px;
  padding: 6px 10px;
  color: #fff; cursor: pointer;
  box-shadow: 0 3px 10px rgba(0,0,0,.5);
  animation: bannerin .3s ease-out;
}
@keyframes bannerin { from { transform: translateY(-100%); } to { transform: none; } }
.nc-banner.out { transition: transform .35s ease-in; transform: translateY(-130%); }
.nc-banner-ico { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 6px; overflow: hidden; }
.nc-banner-ico svg, .nc-banner-ico img { width: 100%; height: 100%; display: block; }
.nc-banner-txt { flex: 1; min-width: 0; }
.nc-banner-txt b { display: block; font-size: 13px; }
.nc-banner-txt span { display: block; font-size: 12px; color: #c5cad4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#notif-center {
  position: absolute; left: 0; right: 0; top: 20px; bottom: 0; z-index: 250;
  background-color: #33373e;
  background-image:
    radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    radial-gradient(rgba(0,0,0,.28) 1px, transparent 1px);
  background-size: 3px 3px, 5px 5px;
  transform: translateY(-102%);
  transition: transform .3s ease-out;
  overflow-y: auto;
  padding: 8px 8px 30px;
}
#notif-center.open { transform: none; }
.nc-widget { margin-bottom: 10px; border-radius: 8px; overflow: hidden;
  background: linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid rgba(0,0,0,.4); padding: 8px 10px; }
.nc-widget-title { font-size: 12px; font-weight: bold; color: #b8bfca; text-shadow: 0 -1px 0 #000;
  display: flex; align-items: center; justify-content: space-between; padding-bottom: 4px; }
.nc-weather { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 14px; font-weight: bold; }
.nc-stocks { color: #7ad07a; font-size: 13px; font-weight: bold; font-variant-numeric: tabular-nums; }
.nc-list { border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,.4); }
.nc-row { display: flex; gap: 8px; align-items: center; padding: 7px 10px;
  background: linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.01));
  border-bottom: 1px solid rgba(0,0,0,.35); color: #fff; cursor: pointer; }
.nc-time { font-size: 10px; color: #8a919d; flex: 0 0 auto; }
.nc-empty { text-align: center; color: #8a919d; font-size: 14px; font-weight: bold; padding: 26px 0; }
.nc-clear { border: 1px solid rgba(0,0,0,.5); border-radius: 5px; padding: 2px 10px;
  background: linear-gradient(#5a606c, #3a3e48); color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; }
.nc-grab { position: absolute; bottom: 0; left: 0; right: 0; height: 22px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; }
.nc-grab i { width: 38px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); }

#switcher {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 240;
  background: linear-gradient(#3a3e48, #22242c);
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(#3a3e48, #22242c);
  background-size: 3px 3px, 100% 100%;
  border-top: 1px solid #000;
  padding: 6px 4px 10px;
  animation: kbup .22s ease-out;
}
.sw-row { display: flex; gap: 14px; overflow-x: auto; padding: 4px 8px; }
.sw-app { flex: 0 0 57px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
.sw-app .glyph { width: 50px; height: 50px; border-radius: 10px; overflow: hidden; }
.sw-app .glyph svg { width: 100%; height: 100%; }
.sw-app .label { font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; }
.sw-music { display: flex; justify-content: center; gap: 34px; padding: 2px 0 6px; color: #fff; }
.sw-music span { display: inline-flex; cursor: pointer; }
.sw-music svg { width: 20px; height: 20px; }

/* ================= Siri ================= */

#siri {
  position: absolute; left: 0; right: 0; bottom: 0; top: 130px; z-index: 265;
  background: linear-gradient(rgba(20,22,30,.96), rgba(8,9,14,.98));
  border-top: 1px solid rgba(255,255,255,.2);
  border-radius: 12px 12px 0 0;
  display: flex; flex-direction: column;
  animation: kbup .25s ease-out;
}
.siri-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  color: #dfe4ec; font-size: 15px; font-weight: bold; }
.siri-mic { width: 34px; height: 34px; border-radius: 50%; padding: 6px;
  background: radial-gradient(circle at 50% 30%, #5a6070, #23262e 75%);
  border: 1px solid #61687a; color: #cfd5df; }
.siri-mic svg { width: 100%; height: 100%; }
.siri-answers { flex: 1; overflow-y: auto; padding: 4px 12px; display: flex; flex-direction: column; gap: 8px; }
.siri-bubble {
  align-self: flex-start; max-width: 250px;
  background: linear-gradient(#3c414e, #262a34);
  border: 1px solid #12141a; border-radius: 10px;
  color: #e8ecf2; font-size: 14px; padding: 7px 11px;
}
.siri-bubble:nth-child(odd) { align-self: flex-end; background: linear-gradient(#4a5468, #303848); }

/* ================= Power off & passcode ================= */

#power-off {
  position: absolute; inset: 0; z-index: 300;
  background: rgba(0,0,0,.72);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 60px 0 60px;
}
.po-track {
  position: relative; width: 270px; height: 48px; border-radius: 12px;
  background: linear-gradient(#1a0b0b, #2a1010);
  box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.15);
}
.po-thumb {
  position: absolute; top: 3px; left: 3px; width: 68px; height: 42px; border-radius: 9px;
  background: linear-gradient(#f0897f, #c73a2e);
  border: 1px solid #7a1512;
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: grab; touch-action: none; z-index: 2;
}
.po-label {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding-left: 40px; font-size: 19px; font-weight: 300; color: rgba(255,220,215,.75);
  pointer-events: none;
}
.po-cancel {
  width: 200px; height: 40px; border-radius: 9px;
  border: 1px solid rgba(0,0,0,.6);
  background: linear-gradient(#94a1b4, #46536a);
  color: #fff; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer;
}

.pc-pad {
  position: absolute; inset: 0; z-index: 310;
  background: linear-gradient(#20242e, #0e1016);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-top: 44px;
}
.pc-title { color: #e8ecf2; font-size: 17px; font-weight: bold; text-shadow: 0 -1px 0 #000; }
.pc-dots { display: flex; gap: 18px; }
.pc-dots.shake { animation: pcshake .35s; }
@keyframes pcshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }
.pc-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #aeb6c4; }
.pc-dot.full { background: #e8ecf2; }
.pc-grid { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; margin-top: 8px; }
.pc-key {
  height: 56px; border-radius: 9px;
  background: linear-gradient(#4a5060, #2c303c);
  border: 1px solid #10121a;
  color: #fff; font-size: 24px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.pc-key:active { background: linear-gradient(#7c9ff0, #2f5bd4); }

/* ================= Spotlight & alarm ================= */

#spotlight {
  position: absolute; inset: 20px 0 0 0; z-index: 245;
  background: rgba(18,22,30,.94);
  display: flex; flex-direction: column;
}
.spot-results { flex: 1; overflow-y: auto; }
.spot-row { display: flex; gap: 10px; align-items: center; padding: 8px 12px;
  border-bottom: 1px solid rgba(255,255,255,.08); color: #fff; cursor: pointer; }
.spot-row:active { background: rgba(120,160,240,.25); }

.alarm-fire {
  position: absolute; inset: 0; z-index: 330;
  background: rgba(8,10,16,.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.alarm-time { font-size: 64px; font-weight: 200; color: #fff; }
.alarm-label { font-size: 17px; color: #b8c0cc; font-weight: bold; margin-bottom: 16px; }

/* ================= LazyVim ================= */

.lv-root { background: #14161f !important; }
.lv-screen {
  flex: 1; overflow-y: auto;
  padding: 8px;
  font: 12px/15px "Menlo", "DejaVu Sans Mono", monospace;
  color: #c8d0e0;
  white-space: pre-wrap; word-break: break-all;
  cursor: text;
}
.lv-cursor { background: #8aadf4; color: #14161f; }
.lv-cursor.ins { background: transparent; color: inherit; border-left: 2px solid #8aadf4; margin-left: -2px; }
.lv-status {
  flex: 0 0 22px;
  background: linear-gradient(#3a4258, #262c3e);
  color: #a8d8a8; font: bold 11px/22px "Menlo", monospace;
  padding: 0 8px;
  border-top: 1px solid #10121a;

}
.lv-dash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
.lv-logo { font: 9px/11px "Menlo", monospace; color: #5ad0b0; text-align: left; }
.lv-btn {
  width: 220px; height: 36px;
  background: linear-gradient(#2c3145, #1c2030);
  border: 1px solid #3a4258; border-radius: 7px;
  color: #c8d0e0; font: bold 13px "Menlo", monospace;
  cursor: pointer;
}
.lv-btn:active { background: #3a4258; }
.lv-hint { color: #5a6478; font: 10px "Menlo", monospace; }
.lv-lazy { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.lv-lazy-head { color: #8aadf4; font: bold 13px "Menlo", monospace; padding-bottom: 6px; }
.lv-lazy-row { display: flex; color: #c8d0e0; font: 12px "Menlo", monospace; gap: 4px; }
.lv-ok { color: #7ad07a; }
.lv-dim { color: #5a6478; }

/* ================= Steps ================= */

.steps-shoe { width: 74px; height: 74px; margin: 10px auto 0; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.35); cursor: pointer; }
.steps-shoe svg { width: 100%; height: 100%; display: block; }
.steps-shoe:active { filter: brightness(.8); }
.steps-big { font-size: 52px; font-weight: 200; color: #2c3a24; margin-top: 4px; }
.steps-track {
  height: 14px; margin: 4px 22px; border-radius: 8px;
  background: linear-gradient(#c2c8ce, #e8ecef);
  box-shadow: inset 0 2px 4px rgba(0,0,0,.3);
  overflow: hidden;
}

      const balloon = (x, y, s, c1, c2) => {
        const gr = g.createLinearGradient(x - s, y, x + s, y);
        gr.addColorStop(0, c1); gr.addColorStop(1, c2);
        g.fillStyle = gr;
        g.beginPath(); g.arc(x, y, s, Math.PI, 0);
        g.quadraticCurveTo(x + s, y + s * 0.9, x, y + s * 1.35);
        g.quadraticCurveTo(x - s, y + s * 0.9, x - s, y);
        g.fill();
        g.fillStyle = "#7a4a22"; g.fillRect(x - s * 0.22, y + s * 1.5, s * 0.44, s * 0.34);
      };
      balloon(90, 100, 36, "#e5533f", "#f5a63f");
      balloon(210, 170, 26, "#3f7ae5", "#3fd0f5");
      balloon(260, 70, 18, "#7ae53f", "#3ff58f");
      g.fillStyle = "#88b06a"; g.fillRect(0, 286, w, h - 286);
    }),
    // 9 polar bear (zoo)
    () => scene((g, w, h) => {
      sky(g, w, h, "#3a4a52", "#54666e", "#6c7e85", 0.5);
      g.fillStyle = "#e9e5da";
      g.beginPath(); g.ellipse(160, 220, 95, 58, 0, 0, 7); g.fill();
      g.beginPath(); g.arc(238, 178, 34, 0, 7); g.fill();
      g.beginPath(); g.arc(262, 154, 9, 0, 7); g.fill();
      g.fillStyle = "#1c1c1c";
      g.beginPath(); g.arc(246, 172, 3.5, 0, 7); g.fill();
      g.beginPath(); g.arc(266, 182, 5, 0, 7); g.fill();
      g.fillStyle = "#cfc9ba";
      g.beginPath(); g.ellipse(120, 268, 90, 16, 0, 0, 7); g.fill();
    }),
    // 10 aurora
    () => scene((g, w, h) => {
      sky(g, w, h, "#03081a", "#07203a", "#0a2a30", 0.8);
      for (let i = 0; i < 5; i++) {
        g.strokeStyle = "rgba(80,255,180," + (0.25 - i * 0.04) + ")";
        g.lineWidth = 16 - i * 2;
        g.beginPath();
        g.moveTo(-10, 80 + i * 22);
        g.bezierCurveTo(100, 30 + i * 18, 220, 140 + i * 10, 330, 60 + i * 20);
        g.stroke();
      }
      g.fillStyle = "#fff";
      for (let i = 0; i < 60; i++) g.fillRect(Math.random() * w, Math.random() * 200, 1.3, 1.3);
      mountains(g, w, h, 280, "#050a12", 60);
    }),
    // 11 tulips
    () => scene((g, w, h) => {
      sky(g, w, h, "#9fd0f0", "#d5ebf8", "#f4fbff", 0.55);
      g.fillStyle = "#4d8a3a"; g.fillRect(0, 200, w, h - 200);
      const colors = ["#e04a4a", "#f0c04a", "#e07ad0", "#f08a4a"];
      for (let i = 0; i < 40; i++) {
        const x = Math.random() * w, y = 210 + Math.random() * 100, s = 5 + (y - 210) / 18;
        g.strokeStyle = "#2f6b22"; g.lineWidth = 2;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - s * 2.2); g.stroke();
        g.fillStyle = colors[i % 4];
        g.beginPath(); g.ellipse(x, y - s * 2.6, s * 0.8, s, 0, 0, 7); g.fill();
      }
    })
  ];

  function ensure() {
    if (!photos.length) makers.forEach(m => photos.push(m()));
  }

  return {
    all() { ensure(); return photos; },
    get(i) { ensure(); return photos[(i % photos.length + photos.length) % photos.length]; },
    add(dataUrl) { ensure(); photos.push(dataUrl); return photos.length - 1; },
    remove(i) { ensure(); photos.splice(i, 1); },
    count() { ensure(); return photos.length; }
  };
})();

/* ---------------- Sound engine (WebAudio, tiny synth) ---------------- */

const Snd = (() => {
  let ctx = null;
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* audio unavailable */ } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, { type = "sine", gain = 0.12, when = 0, freq2 = null } = {}) {
    const master = (typeof Prefs !== "undefined" ? Prefs.get("volume", 12) : 12) / 12;
    if (master <= 0) return;
    gain *= master;
    const a = ac(); if (!a) return;
    const t0 = a.currentTime + when;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const DTMF = {
    "1": [697, 1209], "2": [697, 1336], "3": [697, 1477],
    "4": [770, 1209], "5": [770, 1336], "6": [770, 1477],
    "7": [852, 1209], "8": [852, 1336], "9": [852, 1477],
    "*": [941, 1209], "0": [941, 1336], "#": [941, 1477]
  };
  /* original synthesized melodies — every "ringtone" is a WebAudio phrase */
  const RINGTONES = {
    "Marimba": () => [784, 659, 784, 1046, 784, 659, 523, 659].forEach((f, i) =>
      tone(f, 0.22, { type: "triangle", gain: 0.11, when: i * 0.19 })),
    "Old Phone": () => [0, 0.35, 1.3, 1.65].forEach(w => {
      tone(440, 0.28, { gain: 0.06, when: w }); tone(480, 0.28, { gain: 0.06, when: w }); }),
    "Chimes": () => [1318, 1046, 880, 698].forEach((f, i) =>
      tone(f, 0.8, { gain: 0.08, when: i * 0.42 })),
    "Digital": () => [523, 659, 784, 1046, 784, 659].forEach((f, i) =>
      tone(f, 0.11, { type: "square", gain: 0.05, when: i * 0.14 })),
    "Strum": () => [330, 415, 494, 659, 831].forEach((f, i) =>
      tone(f, 0.55, { type: "triangle", gain: 0.07, when: i * 0.07 }))
  };
  const TEXTTONES = {
    "Tri-tone": () => [1046, 1318, 1568].forEach((f, i) => tone(f, 0.28, { gain: 0.09, when: i * 0.18 })),
    "Ding": () => tone(1568, 0.5, { gain: 0.1 }),
    "Aurora": () => [659, 880, 1174].forEach((f, i) => tone(f, 0.3, { gain: 0.07, when: i * 0.12 })),
    "Pop": () => tone(900, 0.06, { type: "square", gain: 0.09, freq2: 500 })
  };
  const pref = (k, d) => (typeof Prefs !== "undefined" ? Prefs.get(k, d) : d);
  const api = {
    unlock() { ac(); },
    click() { tone(1800, 0.03, { type: "square", gain: 0.04 }); },
    key() { if (pref("kbClicks", true)) tone(1200, 0.035, { type: "square", gain: 0.05 }); },
    dtmf(k) { const p = DTMF[k]; if (p) { tone(p[0], 0.12, { gain: 0.07 }); tone(p[1], 0.12, { gain: 0.07 }); } },
    sent() { tone(880, 0.18, { type: "sine", gain: 0.1, freq2: 1760 }); },
    received() { api.textTone(); },
    lockSnd() { tone(320, 0.05, { type: "square", gain: 0.08 }); tone(180, 0.06, { type: "square", gain: 0.08, when: 0.05 }); },
    unlockSnd() { tone(500, 0.05, { type: "square", gain: 0.07 }); tone(900, 0.07, { type: "square", gain: 0.06, when: 0.04 }); },
    ring(when = 0) { tone(440, 0.9, { gain: 0.05, when }); tone(480, 0.9, { gain: 0.05, when }); },
    ringtone(name) { (RINGTONES[name || pref("ringtone", "Marimba")] || RINGTONES["Marimba"])(); },
    textTone(name) { (TEXTTONES[name || pref("textTone", "Tri-tone")] || TEXTTONES["Tri-tone"])(); },
    ringtoneNames: () => Object.keys(RINGTONES),
    textToneNames: () => Object.keys(TEXTTONES),
    tri() { TEXTTONES["Tri-tone"](); }
  };
  return api;
})();

/* ---------------- Persistent settings ---------------- */

const Prefs = {
  get(k, dflt) {
    try {
      const v = localStorage.getItem("ios6." + k);
      return v === null ? dflt : JSON.parse(v);
    } catch (e) { return dflt; }
  },
  set(k, v) {
    try { localStorage.setItem("ios6." + k, JSON.stringify(v)); } catch (e) { /* private mode */ }
  }
};

/* contacts the user added on-device (Contacts app > +) survive reboots */
Prefs.get("userContacts", []).forEach(c => {
  if (c && c.id && !CONTACTS.some(x => x.id === c.id)) CONTACTS.push(c);
});

</script>
<script>
/* ===================================================================
   iOS 6 · Arch Edition — native bridge & kiosk mode

   When the shell runs on a real Arch system, the `ios6d` daemon
   (127.0.0.1:9641) exposes actual system state: kernel, hostname,
   battery from /sys, Wi-Fi via NetworkManager, modem via ModemManager.
   The UI polls it and prefers real data over the simulation. Without
   the daemon (plain browser demo) everything falls back silently.

   Kiosk mode (?kiosk=1): drops the picture-frame bezel and scales the
   320x480 screen to fill the display — this is how the ISO/package
   run it under cage as the system shell.
   =================================================================== */
"use strict";

const NativeBridge = (() => {
  const BASE = "http://127.0.0.1:9641";
  let info = null;          // last /status payload, or null when offline
  let everSeen = false;

  function get(key, fallback) {
    if (!info) return fallback;
    const v = key.split(".").reduce((o, k) => (o == null ? o : o[k]), info);
    return (v === undefined || v === null || v === "") ? fallback : v;
  }

  function applyToStatusBar() {
    const sb = document.getElementById("statusbar");
    if (!sb || !info) return;
    // battery
    if (info.battery && typeof info.battery.pct === "number") {
      const pct = Math.max(0, Math.min(100, info.battery.pct));
      sb.querySelector(".sb-batt-pct").innerHTML =
        pct + "%" + (info.battery.charging ? Glyphs.bolt() : "");
      sb.querySelector(".sb-batt i").style.right = (100 - pct) * 0.2 + "px";
    }
    // carrier / wifi
    if (!Prefs.get("airplane", false)) {
      const carrier = get("modem.operator", null) || get("wifi.ssid", null);
      if (carrier) sb.querySelector(".sb-carrier").textContent = String(carrier).slice(0, 10);
    }
  }

  async function poll() {
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 1500);
      const r = await fetch(BASE + "/status", { signal: ctl.signal });
      clearTimeout(to);
      info = await r.json();
      everSeen = true;
      applyToStatusBar();
    } catch (e) {
      info = null; // daemon not present — stay in simulation mode
    }
  }

  async function post(path, body) {
    try {
      const r = await fetch(BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      return await r.json();
    } catch (e) {
      return { ok: false, error: "daemon unreachable" };
    }
  }

  poll();
  setInterval(poll, 5000);

  return {
    get active() { return info !== null; },
    get everSeen() { return everSeen; },
    get info() { return info; },
    get,
    call: number => post("/call", { number }),
    sms: (number, text) => post("/sms", { number, text }),
    pkgUpdates: () => fetch(BASE + "/pkg/updates").then(r => r.json()).catch(() => null),
    pkgSearch: q => fetch(BASE + "/pkg/search?q=" + encodeURIComponent(q)).then(r => r.json()).catch(() => null),
    pkgInstall: name => post("/pkg/install", { name }),
    pkgUpgrade: () => post("/pkg/upgrade", {})
  };
})();

/* ---------------- kiosk mode ---------------- */

(() => {
  if (!/[?&]kiosk=1/.test(location.search)) return;
  document.body.classList.add("kiosk");

  const HOME_STRIP = 46; // px reserved at the bottom for the home button

  function layout() {
    const scr = document.getElementById("screen");
    const hb = document.getElementById("home-btn");
    const s = Math.min(innerWidth / 320, (innerHeight - HOME_STRIP) / 480);
    scr.style.transformOrigin = "top left";
    scr.style.transform = `scale(${s})`;
    scr.style.left = Math.round((innerWidth - 320 * s) / 2) + "px";
    scr.style.top = Math.max(0, Math.round((innerHeight - HOME_STRIP - 480 * s) / 2)) + "px";
    hb.style.left = "50%";
    hb.style.transform = "translateX(-50%)";
    hb.style.bottom = "3px";
  }
  addEventListener("resize", layout);
  layout();

  // in kiosk mode the machine is the phone — power straight through boot
  addEventListener("load", () => {
    setTimeout(() => document.getElementById("boot").click(), 400);
  });
})();

</script>

"use strict";

const Icons = (() => {
  let uid = 0;

  function grad(id, stops, x2 = 0, y2 = 1) {
    const s = stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join("");
    return `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${s}</linearGradient>`;
  }
  function rgrad(id, stops, cx = 0.5, cy = 0.35, r = 0.8) {
    const s = stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join("");
    return `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${s}</radialGradient>`;
  }
  function icon(build, { gloss = true } = {}) {
    const p = "i" + (uid++) + "_";
    const { defs, body } = build(p);
    // the iOS 6 sheen: a bright band across the top with a convex lower edge
    const glossDefs = `<linearGradient id="${p}gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.13"/></linearGradient>`;
    const glossBody = `<path d="M0,0 h57 v19 c-13,8.5 -44,8.5 -57,0 z" fill="url(#${p}gloss)"/>
      <rect width="57" height="1" y="0" fill="#ffffff" opacity="0.35"/>`;
    return `<svg viewBox="0 0 57 57" xmlns="http://www.w3.org/2000/svg">
      <defs>${defs}${gloss ? glossDefs : ""}</defs>${body}${gloss ? glossBody : ""}</svg>`;
  }

  /* ---- individual icons ---- */

  const messages = () => icon(p => ({
    defs: grad(p + "g", [[0, "#96ec6d"], [0.45, "#54ca30"], [0.55, "#3cb31c"], [1, "#2f9e13"]]) +
          grad(p + "b", [[0, "#ffffff"], [1, "#e8ece8"]]),
    body: `<rect width="57" height="57" fill="url(#${p}g)"/>
      <path d="M28.5 11.5c-10.6 0-19 6.5-19 14.6 0 4.7 2.9 8.9 7.4 11.6-.4 2.6-1.5 5-3.6 6.9 3.7-.4 6.9-1.7 9.4-3.6 1.8.4 3.8.7 5.8.7 10.6 0 19-6.5 19-14.6s-8.4-15.6-19-15.6z"
        fill="url(#${p}b)" stroke="#1d7a08" stroke-width="0.8"/>`
  }));

  const calendar = () => {
    const now = new Date();
    const wd = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][now.getDay()];
    return icon(p => ({
      defs: grad(p + "r", [[0, "#f77e6e"], [0.48, "#e0402f"], [0.52, "#c53222"], [1, "#d2402e"]]) +
            grad(p + "w", [[0, "#ffffff"], [1, "#dfe2e6"]]),
      body: `<rect width="57" height="57" fill="url(#${p}w)"/>
        <rect width="57" height="16" fill="url(#${p}r)"/>
        <text x="28.5" y="12" text-anchor="middle" font-family="Helvetica,Arial" font-size="9" fill="#fff" font-weight="bold">${wd}</text>
        <text x="28.5" y="46" text-anchor="middle" font-family="Helvetica,Arial" font-size="30" fill="#333" font-weight="300">${now.getDate()}</text>`
    }), { gloss: false });

  const photos = () => icon(p => {
    const colors = ["#f9d949", "#f5a833", "#ef6e2b", "#e0382b", "#c03a92", "#5a4ac8", "#3a86d8", "#4fb848"];
    let petals = "";
    for (let ring = 0; ring < 2; ring++) {
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 + (ring ? Math.PI / 8 : 0);
        const d = ring ? 9 : 12.5, rx = ring ? 6.2 : 8, ry = ring ? 3.6 : 4.6;
        petals += `<ellipse cx="${28.5 + Math.cos(a) * d}" cy="${27 + Math.sin(a) * d}" rx="${rx}" ry="${ry}"
          transform="rotate(${a * 180 / Math.PI} ${28.5 + Math.cos(a) * d} ${27 + Math.sin(a) * d})"
          fill="${colors[i]}" opacity="${ring ? 0.65 : 0.94}"/>`;
      }
    }
    return {
      defs: grad(p + "w", [[0, "#ffffff"], [1, "#d4d8de"]]) +
            rgrad(p + "c", [[0, "#ffffff"], [0.7, "#fbf6e2"], [1, "#efe2b0"]]),
      body: `<rect width="57" height="57" fill="url(#${p}w)"/>${petals}
        <circle cx="28.5" cy="27" r="5.2" fill="url(#${p}c)" stroke="#dcc36a" stroke-width="1"/>`

  const camera = () => icon(p => ({

  const videos = () => icon(p => ({

  const weather = () => icon(p => ({
    defs: grad(p + "b", [[0, "#63b1f2"], [1, "#1e60c8"]]) + rgrad(p + "s", [[0, "#fff8d0"], [0.55, "#ffd94a"], [1, "#f5a11f"]]),
    body: `<rect width="57" height="57" fill="url(#${p}b)"/>

      }).join("")}`
  }));

  const passbook = () => icon(p => ({
    defs: grad(p + "bg", [[0, "#4d5464"], [1, "#2c3140"]]),
    body: `<rect width="57" height="57" fill="url(#${p}bg)"/>
      <rect x="9" y="8" width="39" height="14" rx="4" fill="#e2574c"/>
      <rect x="9" y="17" width="39" height="14" rx="4" fill="#f2b63c"/>

      <rect x="9" y="35" width="39" height="15" rx="4" fill="#e8eaee"/>

  }));

  const notes = () => icon(p => ({
    defs: grad(p + "y", [[0, "#fdf7c9"], [1, "#f0e5a0"]]) + grad(p + "l", [[0, "#8a7a5a"], [1, "#5d4f36"]]),
    body: `<rect width="57" height="57" fill="url(#${p}y)"/>
      <rect width="57" height="15" fill="url(#${p}l)"/>
      ${[10, 20, 30, 40, 47].map(x => `<circle cx="${x}" cy="12.5" r="1.6" fill="#e8dfb5"/>`).join("")}
      ${[24, 32, 40, 48].map(y => `<line x1="4" y1="${y}" x2="53" y2="${y}" stroke="#d9c98f" stroke-width="1"/>`).join("")}
      <line x1="4" y1="28" x2="42" y2="28" stroke="#9aa4b5" stroke-width="1.6" opacity="0.7"/>
      <line x1="4" y1="36" x2="47" y2="36" stroke="#9aa4b5" stroke-width="1.6" opacity="0.7"/>`
  }), { gloss: false });

  const reminders = () => icon(p => ({
    defs: grad(p + "w", [[0, "#fdfdfd"], [1, "#e3e6ea"]]),
    body: `<rect width="57" height="57" fill="url(#${p}w)"/>
      ${[16, 28, 40].map((y, i) => `

        <line x1="22" y1="${y}" x2="49" y2="${y}" stroke="#aeb3bb" stroke-width="2.4"/>`).join("")}`
  }), { gloss: false });

  const clockIcon = () => {
    const now = new Date();
    const hA = ((now.getHours() % 12) + now.getMinutes() / 60) * 30 - 90;
    const mA = now.getMinutes() * 6 - 90;
