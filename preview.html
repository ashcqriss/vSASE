    f.append(h("span", "caret"));
  };
  Object.defineProperty(f, "value", {
    get: () => f._value,
    set: v => { f._value = v; f._renderValue(); }
  });
  f.addEventListener("click", e => { e.stopPropagation(); KB.open(f); f._renderValue(); });
  f._renderValue();
  return f;
}

/* ---------------- the OS ---------------- */

const IOS = (() => {
  const apps = {};
  let currentApp = null;
  let state = "off"; // off | boot | locked | home | app | asleep
  let page = 0;

  const screen = $id("screen"), home = $id("home"), appLayer = $id("app"),
        lock = $id("lock"), statusbar = $id("statusbar"), wallpaper = $id("wallpaper");

  const HOME_PAGES = [
    ["messages", "calendar", "photos", "camera", "videos", "weather", "passbook", "notes",
     "reminders", "clock", "maps", "stocks", "newsstand", "itunes", "appstore", "gamecenter"],
    ["settings", "contacts", "calculator", "compass", "voicememos", "terminal", "cydia"]
  ];
  const DOCK = ["phone", "mail", "safari", "music"];
  let editMode = false; // wiggle mode: long-press an icon, ✕ removes installed apps

  function currentPages() {
    const known = id => !!apps[id];
    const extra = (typeof AppMarket !== "undefined")
      ? AppMarket.installed().filter(known) : [];
    const wanted = [...HOME_PAGES.flat(), ...extra];
    const saved = Prefs.get("homeLayout", null);
    let pages;
    if (Array.isArray(saved) && saved.length) {
      // user-arranged order wins; drop apps that no longer exist/are uninstalled
      const valid = new Set(wanted);
      pages = saved.map(p => p.filter(id => valid.has(id)));
    } else {
      pages = HOME_PAGES.map(p => [...p]);
    }
    const present = new Set(pages.flat());
    for (const id of wanted) {
      if (present.has(id)) continue;
      if (!pages.length || pages[pages.length - 1].length >= 16) pages.push([]);
      pages[pages.length - 1].push(id);
      present.add(id);
    }
    pages = pages.filter(p => p.length);
    return pages.length ? pages : HOME_PAGES.map(p => [...p]);
  }

  /* the DOM order after a drag IS the layout */
  function saveLayout() {
    const layout = [...$id("pages").children]
      .map(pg => [...pg.querySelectorAll(".sb-icon")].map(el => el.dataset.app))
      .filter(p => p.length);
    Prefs.set("homeLayout", layout);
  }

  /* ---- status bar ---- */
  function setTint(t) {
    statusbar.classList.remove("sb-black", "sb-blue", "sb-trans");
    statusbar.classList.add("sb-" + (t || "black"));
  }
  function refreshSignal() {
    const airplane = Prefs.get("airplane", false);
    const wifi = Prefs.get("wifi", true);
    const carrier = statusbar.querySelector(".sb-carrier");
    if (airplane) carrier.innerHTML = Glyphs.plane();
    else carrier.textContent = Prefs.get("carrier", "arch");
    statusbar.querySelector(".sb-signal").classList.toggle("off", airplane);
    statusbar.querySelector(".sb-wifi").style.visibility = (wifi && !airplane) ? "visible" : "hidden";
  }
  function tick() {
    const now = new Date();
    statusbar.querySelector(".sb-time").textContent = fmtTime(now);
    lock.querySelector(".lock-time").textContent = fmtTime(now, false);
    lock.querySelector(".lock-date").textContent =
      WEEKDAYS[now.getDay()] + ", " + MONTHS[now.getMonth()] + " " + now.getDate();
  }
  setInterval(tick, 1000);

  /* ---- wallpaper & brightness ---- */
  function applyWallpaper() {
    const wp = Prefs.get("wallpaper", "wp-water");
    if (wp === "wp-custom") {
      wallpaper.className = "wp-custom";
      wallpaper.style.backgroundImage = "url(" + Prefs.get("wallpaperData", "") + ")";
    } else {
      wallpaper.style.backgroundImage = "";
      wallpaper.className = wp;
    }
  }
  function applyBrightness() {
    $id("dimmer").style.opacity = (1 - Prefs.get("brightness", 100) / 100) * 0.75;
  }

  /* ---- springboard ---- */
  function iconEl(id) {
    const def = apps[id];
    if (!def) return null;
    const badge = def.badge ? def.badge() : 0;
    const glyph = h("div", { class: "glyph", html: def.icon() });
    // artwork override: if icons/<id>.png exists it replaces the built-in SVG
    // (drop real iOS 6 icon art — e.g. from an OldOS checkout — into icons/)
    const art = new Image();
    art.onload = () => { glyph.innerHTML = ""; glyph.append(art); };
    art.src = "icons/" + id + ".png";
    const removable = editMode && def.removable;
    const e = h("div", { class: "sb-icon" + (editMode ? " wiggling" : ""), "data-app": id },
      h("div", "glyph-wrap",
        glyph,
        badge && !editMode ? h("div", "sb-badge", String(badge)) : null,
        removable ? h("div", { class: "sb-remove", onclick: ev => {
          ev.stopPropagation();
          AppMarket.uninstall(id);
          buildHome();
        } }, "✕") : null),
      h("div", "label", def.name));
    e.addEventListener("click", () => { if (!editMode) open(id); });
    // long-press enters wiggle mode
    let lp = null;
    e.addEventListener("pointerdown", ev => {
      if (editMode) { startIconDrag(e, ev); return; }
      lp = setTimeout(() => { editMode = true; Snd.click(); buildHome(); }, 650);
    });
    const cancelLp = () => { if (lp) { clearTimeout(lp); lp = null; } };
    e.addEventListener("pointerup", cancelLp);
    e.addEventListener("pointerleave", cancelLp);
    e.addEventListener("pointermove", cancelLp); // a drag is a swipe, not a hold
    return e;
  }

  /* ---- wiggle-mode drag to rearrange (persists across reboots) ---- */
  let iconDragging = false;
  function startIconDrag(icon, ev) {
    if (ev.target.closest(".sb-remove")) return; // the ✕ stays a tap
    const screenEl = $id("screen");
    const x0 = ev.clientX, y0 = ev.clientY;
    let ghost = null, lastFlip = 0;
    try { icon.setPointerCapture(ev.pointerId); } catch (e2) { /* older engines */ }

    function lift(mv) {
      iconDragging = true;
      const r = icon.getBoundingClientRect(), sr = screenEl.getBoundingClientRect();
      ghost = icon.cloneNode(true);
      ghost.classList.remove("wiggling");
      ghost.classList.add("drag-ghost");
      ghost.style.left = (r.left - sr.left) + "px";
      ghost.style.top = (r.top - sr.top) + "px";
      screenEl.append(ghost);
      icon.classList.add("drag-src");
      move(mv);
    }

    function move(mv) {
      const sr = screenEl.getBoundingClientRect();
      ghost.style.left = (mv.clientX - sr.left - 28) + "px";
      ghost.style.top = (mv.clientY - sr.top - 40) + "px";

      // hovering a screen edge flips the page (once per 600ms)
      const sx = mv.clientX - sr.left;
      const now = Date.now();
      const pageCount = $id("pages").children.length;
      if (now - lastFlip > 600) {
        if (sx < 26 && page > 0) { page--; snapPage(); lastFlip = now; }
        else if (sx > sr.width - 26 && page < pageCount - 1) { page++; snapPage(); lastFlip = now; }
      }

      // live reflow: slot the real (dimmed) icon where the pointer points
      const under = document.elementsFromPoint(mv.clientX, mv.clientY);
      const target = under.find(el => el.classList && el.classList.contains("sb-icon")
        && el !== icon && !el.classList.contains("drag-ghost"));
      if (target && target.parentElement) {
        const tr = target.getBoundingClientRect();
        const after = mv.clientX > tr.left + tr.width / 2;
        target.parentElement.insertBefore(icon, after ? target.nextSibling : target);
      } else {
        const pg = under.find(el => el.classList && el.classList.contains("page"));
        if (pg && icon.parentElement !== pg && pg.querySelectorAll(".sb-icon").length < 16)
          pg.append(icon);
      }
    }

    function onMove(mv) {
      if (!ghost && Math.hypot(mv.clientX - x0, mv.clientY - y0) < 8) return;
      if (!ghost) lift(mv); else move(mv);
    }
    function onUp() {
      // listeners live on document: pointer capture is unreliable once the
      // pointer leaves the (wiggling) icon, and a drop must always land
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      if (!ghost) return;
      ghost.remove();
      icon.classList.remove("drag-src");
      iconDragging = false;
      saveLayout();
      Snd.click();
    }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  function buildHome() {
    document.querySelectorAll(".drag-ghost").forEach(g => g.remove());
    const layout = currentPages();
    if (page >= layout.length) page = layout.length - 1;
    const pages = $id("pages");
    pages.innerHTML = "";
    layout.forEach(ids => pages.append(h("div", "page", ids.map(iconEl))));
    pages.classList.toggle("editing", editMode);
    const dock = $id("dock-icons");
    dock.innerHTML = "";
    DOCK.forEach(id => dock.append(iconEl(id)));
    const dots = $id("page-dots");
    dots.innerHTML = "";
    dots.append(h("span", { class: "dot-mag", html: Glyphs.search() }));
    layout.forEach((_, i) => dots.append(h("i", i === page ? "on" : "")));
    snapPage(false);
  }

  function snapPage(animate = true) {
    const pages = $id("pages");
    pages.style.transition = animate ? "" : "none";
    pages.style.transform = `translateX(${-page * 320}px)`;
    if (!animate) requestAnimationFrame(() => { pages.style.transition = ""; });
    [...$id("page-dots").querySelectorAll("i")].forEach((d, i) => d.classList.toggle("on", i === page));
  }

  // swipe pages
  (() => {
    const pages = $id("pages");
    let x0 = null, dx = 0, swiped = false;
    // a swipe must not count as a tap on whatever icon ends up under the pointer
    pages.addEventListener("click", e => {
      if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; }
    }, true);
    pages.addEventListener("pointerdown", e => {
      // in wiggle mode a press on an icon is a drag, not a page swipe
      if (editMode && e.target.closest(".sb-icon")) { x0 = null; return; }
      x0 = e.clientX; dx = 0; swiped = false;
    });
    pages.addEventListener("pointermove", e => {
      if (x0 === null || iconDragging) return;
      dx = e.clientX - x0;
      if (Math.abs(dx) > 8) {
        pages.style.transition = "none";
        pages.style.transform = `translateX(${-page * 320 + dx}px)`;
      }
    });
    const end = () => {
      if (x0 === null) return;
      swiped = Math.abs(dx) > 10;
      pages.style.transition = "";
      if (dx < -50 && page < pages.children.length - 1) page++;
      else if (dx > 50 && page > 0) page--;
      snapPage();
      x0 = null;
    };
    pages.addEventListener("pointerup", end);
    pages.addEventListener("pointerleave", end);
  })();

  /* ---- app lifecycle ---- */
  function open(id) {
    const def = apps[id];
    if (!def) return;
    Snd.click();
    currentApp = def;
    appLayer.innerHTML = "";
    const root = h("div", "app-root" + (def.rootClass ? " " + def.rootClass : ""));
    appLayer.append(root);
    setTint(def.statusbar || "black");
    appLayer.classList.remove("hidden", "closing");
    appLayer.classList.add("opening");
    setTimeout(() => appLayer.classList.remove("opening"), 300);
    home.classList.add("hidden");
    state = "app";
    def.render(root);
    if (def.onOpen) def.onOpen();
  }

  function goHome() {
    if (state === "app") {
      KB.close();
      document.querySelectorAll(".sheet-wrap, .alert-wrap").forEach(x => x.remove());
      if (currentApp && currentApp.onClose) { try { currentApp.onClose(); } catch (e) { /* app cleanup */ } }
      currentApp = null;
      home.classList.remove("hidden");
      buildHome();
      appLayer.classList.add("closing");
      setTimeout(() => { appLayer.classList.add("hidden"); appLayer.classList.remove("closing"); appLayer.innerHTML = ""; }, 220);
      setTint("trans");
      state = "home";
    } else if (state === "home") {
      if (editMode) { editMode = false; buildHome(); }
      else { page = 0; snapPage(); }
    } else if (state === "asleep") {
      wake();
    }
  }

  /* ---- lock / sleep ---- */
  function showLock() {
    tick();
    lock.classList.remove("hidden");
    statusbar.classList.remove("hidden");
    setTint("trans");
    state = "locked";
    resetThumb();
  }
  function unlock() {
    Snd.unlockSnd();
    lock.classList.add("hidden");
    home.classList.remove("hidden");
    buildHome();
    setTint("trans");
    state = "home";
  }
  function sleep() {
    if (state === "off" || state === "boot") return;
    Snd.lockSnd();
    KB.close();
    $id("screen-off").classList.remove("hidden");
    state = "asleep";
  }
  function wake() {
    $id("screen-off").classList.add("hidden");
    // whatever was below stays; if an app/home was up, drop back to lock screen
    if (!appLayer.classList.contains("hidden")) {
      appLayer.classList.add("hidden"); appLayer.innerHTML = ""; currentApp = null;
    }
    home.classList.add("hidden");
    showLock();
  }

  /* ---- slide to unlock ---- */
  const thumb = lock.querySelector(".lock-thumb");
  const MAXX = 190;
  function resetThumb() { thumb.style.transition = ""; thumb.style.transform = "translateX(0)"; }
  (() => {
    let x0 = null, cur = 0;
    thumb.addEventListener("pointerdown", e => {
      x0 = e.clientX; cur = 0;
      thumb.setPointerCapture(e.pointerId);
      thumb.style.transition = "none";
      Snd.unlock();
    });
    thumb.addEventListener("pointermove", e => {
      if (x0 === null) return;
      cur = Math.max(0, Math.min(MAXX, e.clientX - x0));
      thumb.style.transform = `translateX(${cur}px)`;
    });
    thumb.addEventListener("pointerup", () => {
      if (x0 === null) return;
      x0 = null;
      thumb.style.transition = "transform .25s ease-out";
      // route through IOS.unlock so wrappers (passcode lock) can intercept
      if (cur > MAXX - 30) IOS.unlock();
      else thumb.style.transform = "translateX(0)";
    });
  })();

  /* ---- hardware buttons ---- */
  $id("home-btn").addEventListener("click", () => { Snd.unlock(); goHome(); });
  $id("power-btn").addEventListener("click", () => {
    if (state === "off") return;
    if (state === "asleep") wake(); else sleep();
  });
  $id("screen-off").addEventListener("click", wake);

  /* ---- volume rocker + the translucent bezel HUD ---- */
  (() => {
    const hud = h("div", { class: "vol-hud hidden" },
      h("div", { class: "vol-ico", html: Glyphs.speaker() }),
      h("div", "vol-bars", Array.from({ length: 16 }, () => h("i"))));
    $id("screen").append(hud);
    let hideT = null;
    function bump(delta) {
      if (state === "off" || state === "boot") return;
      const v = Math.max(0, Math.min(16, Prefs.get("volume", 12) + delta));
      Prefs.set("volume", v);
      [...hud.querySelectorAll(".vol-bars i")].forEach((b, i) => b.classList.toggle("on", i < v));
      hud.classList.remove("hidden");
      clearTimeout(hideT);
      hideT = setTimeout(() => hud.classList.add("hidden"), 1200);
      Snd.click();
    }
    document.querySelector(".dev-vol-up").addEventListener("click", () => bump(2));
    document.querySelector(".dev-vol-down").addEventListener("click", () => bump(-2));
  })();

  return {
    register(def) { apps[def.id] = def; },
    app(id) { return apps[id]; },
    open, goHome, showLock, unlock,
    setTint, refreshSignal, applyWallpaper, applyBrightness, buildHome, tick,
    get state() { return state; },
    set state(s) { state = s; }
  };
})();

</script>
<script>
/* ===================================================================
   iOS 6 · Arch Edition — Messages, Phone, Contacts, Mail
   =================================================================== */
"use strict";

/* =================================================================
   Shared: in-call screen (used by Phone app & contact pages)
   ================================================================= */

const CallSession = (() => {
  let timerId = null, ringId = null;

  function end(screenEl) {
    clearInterval(timerId); clearTimeout(ringId);
    timerId = ringId = null;
    screenEl.remove();
  }

  function start(parent, { name, number }) {
    const stateEl = h("div", "call-state", "calling mobile…");
    // on real hardware with a modem, place the call through ModemManager
    if (number && NativeBridge.active && NativeBridge.get("modem.present", false)) {
      stateEl.textContent = "dialing via modem…";
      NativeBridge.call(number).then(r => {
        if (r && r.ok) stateEl.textContent = "connected via ModemManager";
        else stateEl.textContent = "modem: " + ((r && r.error) || "call failed") + " — simulating";
      });
    }
    const grid = h("div", "call-grid",
      [["mute", "mute"], ["keypad", "keypad"], ["speaker", "speaker"],
       ["plus", "add call"], ["video", "FaceTime"], ["person", "contacts"]].map(([ico, lbl]) => {
        const d = h("div", null, h("div", { class: "cg-ico", html: Glyphs[ico]() }), h("div", null, lbl));
        d.addEventListener("click", () => { Snd.click(); d.classList.toggle("active"); });
        return d;
      }));
    const scr = h("div", "call-screen",
      h("div", "call-name", name || number || "Unknown"),
      stateEl, grid,
      h("button", { class: "call-end", onclick: () => { Snd.lockSnd(); end(scr); } }, "End"));
    parent.append(scr);

    Snd.ring(0.3); Snd.ring(2.4);
    let secs = 0;
    ringId = setTimeout(() => {
      stateEl.textContent = "00:00";
      timerId = setInterval(() => {
        secs++;
        stateEl.textContent = String(Math.floor(secs / 60)).padStart(2, "0") + ":" + String(secs % 60).padStart(2, "0");
      }, 1000);
    }, 4200);

    PhoneApp.addRecent({ name: name || number, time: fmtTime(new Date()), type: "out" });
    return scr;
  }

  function cleanup() { clearInterval(timerId); clearTimeout(ringId); timerId = ringId = null; }
  return { start, cleanup };
})();

/* =================================================================
   FaceTime — self-view from the front camera while "connecting"
   ================================================================= */

async function faceTimeCall(c) {
  const self = h("video", { class: "ft-self", autoplay: "", playsinline: "" });
  self.muted = true;
  let stream = null;
  const stateEl = h("div", "call-state", "FaceTime — connecting…");
  const scr = h("div", { class: "call-screen", style: { zIndex: 320 } },
    h("div", "call-name", contactName(c)), stateEl, self,
    h("button", { class: "call-end", style: { marginTop: "auto", marginBottom: "40px" }, onclick: end }, "End"));
  function end() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    clearTimeout(timer);
    scr.remove(); Snd.lockSnd();
  }
  $id("screen").append(scr);
  Snd.ring(0.2);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "user" } } });
    self.srcObject = stream;
    self.classList.add("live");
  } catch (e) { self.remove(); }
  const timer = setTimeout(() => {
    stateEl.textContent = contactName(c) + " is not available for FaceTime.";
    setTimeout(end, 2200);
  }, 5000);
}

/* =================================================================
   Shared: contact detail view
   ================================================================= */

function contactDetailView(nav, c, appRoot) {
  const initials = (c.first[0] || "") + (c.last[0] || "");
  const view = navView(
    navbar("Info", { left: backBtn("Back", () => nav.pop()) }),
    h("div", "content grouped",
      h("div", "ct-head",
        h("div", "ct-avatar", initials.toUpperCase()),
        h("div", null, h("div", "ct-fullname", contactName(c)),
          c.imessage ? h("div", { style: { fontSize: "12px", color: "#5b74a8" } }, "iMessage") : null)),
      group(
        cell({ label: "mobile", value: c.phone, onTap: () => CallSession.start(appRoot, { name: contactName(c), number: c.phone }) })),
      group(
        cell({ label: "home", value: c.email, onTap: () => IOS.open("mail") })),
      group(
        cell({ label: "Send Message", onTap: () => { IOS.open("messages"); setTimeout(() => MessagesApp.openThreadFor(c.id), 50); } }),
        cell({ label: "FaceTime", right: gl("video", 18), onTap: () => faceTimeCall(c) }),
        cell({ label: "Share Contact", onTap: () => showSheet([
          { label: "Email Contact", onTap: () => IOS.open("mail") },
          { label: "Message Contact", onTap: () => IOS.open("messages") },
          { label: "Cancel", style: "cancel" }]) }))));
  return view;
}

function contactListInto(nav, contentEl, appRoot, { grouped = false } = {}) {
  const sorted = [...CONTACTS].sort((a, b) => (a.last || a.first).localeCompare(b.last || b.first));
  let letter = "";
  sorted.forEach(c => {
    const l = ((c.last || c.first)[0] || "#").toUpperCase();
    if (l !== letter) { letter = l; contentEl.append(h("div", "ct-sec", l)); }
    const row = cell({
      label: h("span", null, c.first + " ", h("b", null, c.last)),
      onTap: () => nav.push(contactDetailView(nav, c, appRoot))
    });
    contentEl.append(row);
  });
  const idx = h("div", "ct-index", "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(ch => h("div", null, ch)));
  contentEl.append(idx);
}

/* =================================================================
   Messages
   ================================================================= */

const MessagesApp = (() => {
  let nav = null, appRoot = null, replyTimer = null;

  function unreadCount() { return THREADS.filter(t => t.unread).length; }

  function threadCellPreview(t) {
    const last = t.msgs[t.msgs.length - 1];
    return last ? (last.kind === "photo" ? "Photo" : last.text) : "";
  }

  let editing = false;
  function listView() {
    const list = h("div", "content list msg-list");
    function paint() {
      list.innerHTML = "";
      THREADS.forEach((t, i) => {
        const c = contactById(t.contact);
        const del = h("div", { class: "msg-del", html: "−" });
        del.addEventListener("click", e => {
          e.stopPropagation();
          showSheet([
            { label: "Delete conversation with " + contactName(c), style: "destructive",
              onTap: () => { THREADS.splice(i, 1); paint(); } },
            { label: "Cancel", style: "cancel" }]);
        });
        const row = h("div", "cell",
          editing ? del : h("div", "msg-unread" + (t.unread ? "" : " off")),
          h("div", "msg-cell-main",
            h("div", "msg-cell-top",
              h("span", "msg-cell-name", contactName(c)),
              h("span", "msg-cell-time", t.time + " ›")),
            h("div", "msg-cell-preview", threadCellPreview(t))));
        if (!editing) row.addEventListener("click", () => { Snd.click(); openThread(t); });
        list.append(row);
      });
      if (!THREADS.length) list.append(h("div", "empty-msg", "No Messages"));
    }
    paint();
    const editBtn = navBtn("Edit", () => { editing = !editing; editBtn.textContent = editing ? "Done" : "Edit"; paint(); });
    return navView(
      navbar("Messages", {
        left: editBtn,
        right: navBtn(gl("compose", 15), () => composeSheet())
      }),
      list);
  }

  function composeSheet() {
    /* a real New Message screen: pick any contact, or type any number */
    const sug = h("div", { class: "content list", style: { flex: "1" } });
    function paintSug(q) {
      sug.innerHTML = "";
      const ql = (q || "").toLowerCase();
      CONTACTS.filter(c => !ql || contactName(c).toLowerCase().includes(ql) || c.phone.replace(/\D/g, "").includes(ql.replace(/\D/g, "") || "␀"))
        .slice(0, 9)
        .forEach(c => sug.append(cell({ label: contactName(c), value: c.phone,
          onTap: () => { KB.close(); nav.pop(); openThreadFor(c.id); } })));
    }
    const to = kbField("To: name or number", {
      returnLabel: "Go", blueReturn: true,
      onChange: paintSug,
      onReturn: v => {
        KB.close();
        const q = v.trim();
        if (!q) return;
        let c = CONTACTS.find(x => contactName(x).toLowerCase() === q.toLowerCase()) || contactByNumber(q);
        if (!c) {
          const digits = q.replace(/\D/g, "");
          if (digits.length < 3)
            return showAlert({ title: "Messages", text: "Type a contact name, or a phone number to start a new conversation." });
          c = { id: "u" + digits, first: q, last: "", phone: q, email: "", imessage: false, fav: false };
          CONTACTS.push(c);
          Prefs.set("userContacts", [...Prefs.get("userContacts", []), c]);
        }
        nav.pop();
        openThreadFor(c.id);
      }
    });
    paintSug("");
    nav.push(navView(
      navbar("New Message", { left: navBtn("Cancel", () => { KB.close(); nav.pop(); }) }),
      h("div", "searchbar", to),
      sug));
    setTimeout(() => KB.open(to), 120);
  }

  function bubbleEl(t, m) {
    if (m.kind === "photo") {
      const b = h("div", "bubble " + (m.dir === "in" ? "in" : (t.service === "imessage" ? "out-i" : "out-s")));
      b.append(h("img", { src: PhotoStore.get(m.photo) }));
      return b;
    }
    return h("div", "bubble " + (m.dir === "in" ? "in" : (t.service === "imessage" ? "out-i" : "out-s")), m.text);
  }

  function openThreadFor(contactId) {
    let t = THREADS.find(x => x.contact === contactId);
    if (!t) {
      const c = contactById(contactId);
      t = { id: contactId, contact: contactId, service: c.imessage ? "imessage" : "sms", unread: false, time: "Now", msgs: [], replies: ["👍", "Sounds good!", "Ok!"] };
      THREADS.unshift(t);
    }
    openThread(t);
  }

  function openThread(t) {
    t.unread = false;
    const c = contactById(t.contact);
    const chat = h("div", "chat");
    chat.append(h("div", "chat-daystamp", (t.service === "imessage" ? "iMessage" : "Text Message") + " · Today " + fmtTime(new Date())));
    t.msgs.forEach(m => chat.append(bubbleEl(t, m)));
    const lastOut = [...t.msgs].reverse().find(m => m.dir === "out");
    if (lastOut && lastOut.delivered && t.service === "imessage")
      chat.append(h("div", "chat-status", "Delivered"));

    const isIM = t.service === "imessage";
    const sendBtn = h("button", "msg-send", "Send");
    const field = kbField(isIM ? "iMessage" : "Text Message", {
      returnLabel: "Send", blueReturn: isIM,
      onChange: v => sendBtn.classList.toggle("ready", v.trim().length > 0),
      onReturn: () => doSend()
    });
    if (!isIM) sendBtn.classList.add("sms");

    function scrollDown() { chat.scrollTop = chat.scrollHeight; }

    function appendOut(msg) {
      t.msgs.push(msg);
      chat.querySelectorAll(".chat-status").forEach(x => x.remove());
      chat.append(bubbleEl(t, msg));
      if (isIM) chat.append(h("div", "chat-status", "Delivered"));
      t.time = fmtTime(new Date());
      Snd.sent();
      scrollDown();
      scheduleReply();
    }

    function doSend() {
      const text = field.value.trim();
      if (!text) return;
      field.value = "";
      sendBtn.classList.remove("ready");
      // real SMS through ModemManager when running on hardware with a modem
      if (!isIM && NativeBridge.active && NativeBridge.get("modem.present", false))
        NativeBridge.sms(c.phone, text);
      appendOut({ dir: "out", text, delivered: true });
    }

    function scheduleReply() {
      clearTimeout(replyTimer);
      replyTimer = setTimeout(() => {
        const typing = h("div", "bubble in typing", h("i"), h("i"), h("i"));
        chat.append(typing); scrollDown();
        replyTimer = setTimeout(() => {
          typing.remove();
          const pool = t.replies || ["Ok!"];
          const msg = { dir: "in", text: pool[(t._ri = ((t._ri || 0) + 1) % pool.length)] };
          t.msgs.push(msg);
          chat.append(bubbleEl(t, msg));
          Snd.received();
          scrollDown();
        }, 1600 + Math.random() * 1400);
      }, 900 + Math.random() * 900);
    }

    sendBtn.addEventListener("click", doSend);

    const camBtn = h("div", { class: "msg-cam", html: Glyphs.camera() });
    camBtn.addEventListener("click", () => {
      Snd.click();
      showSheet([
        { label: "Take Photo or Video", onTap: () => IOS.open("camera") },
        { label: "Choose Existing", onTap: () => pickPhoto(url => {
            appendOut({ dir: "out", kind: "photo", photo: PhotoStore.all().indexOf(url) });
          }) },
        { label: "Cancel", style: "cancel" }
      ]);
    });

    const view = navView(
      navbar(contactName(c), {
        left: backBtn("Messages", () => nav.pop()),
        right: navBtn("Edit", () => {})
      }),
      chat,
      h("div", "msg-inputbar", camBtn, field, sendBtn));
    nav.push(view);
    setTimeout(scrollDown, 30);
  }

  function pickPhoto(onPick) {
    const wrap = h("div", { class: "sheet-wrap" });
    const grid = h("div", "photo-grid", PhotoStore.all().map(url => {
      const img = h("img", { src: url });
      img.addEventListener("click", () => { wrap.remove(); onPick(url); });
      return img;
    }));
    const panel = h("div", { class: "sheet", style: { maxHeight: "330px", overflowY: "auto" } },
      h("div", { style: { color: "#fff", fontWeight: "bold", textAlign: "center", padding: "2px 0 6px" } }, "Camera Roll"),
      grid,
      h("button", { class: "cancel", onclick: () => wrap.remove(), style: { marginTop: "8px" } }, "Cancel"));
    wrap.append(panel);
    wrap.addEventListener("click", e => { if (e.target === wrap) wrap.remove(); });
    $id("screen").append(wrap);
  }

  IOS.register({
    id: "messages",
    name: "Messages",
    icon: Icons.messages,
    statusbar: "blue",
    badge: unreadCount,
    onClose() { clearTimeout(replyTimer); },
    render(root) {
      appRoot = root;
      nav = new UINav(root);
      nav.push(listView(), false);
    }
  });

  return { openThreadFor };
})();

/* =================================================================
   Phone
   ================================================================= */

const PhoneApp = (() => {
  const RECENTS = Prefs.get("recents", null) || [
    { name: "Mom", time: "9:15 AM", type: "in" },
    { name: "Kate Bell", time: "Yesterday", type: "missed" },
    { name: "Natalia Maric", time: "Yesterday", type: "out" },
    { name: "(555) 284-1103", time: "Tuesday", type: "missed" },
    { name: "Zach Wood", time: "Monday", type: "out" }
  ];
  function addRecent(r) {
    RECENTS.unshift(r);
    if (RECENTS.length > 40) RECENTS.pop();
    Prefs.set("recents", RECENTS);
  }

  const KEYS = [
    ["1", ""], ["2", "ABC"], ["3", "DEF"],
    ["4", "GHI"], ["5", "JKL"], ["6", "MNO"],
    ["7", "PQRS"], ["8", "TUV"], ["9", "WXYZ"],
    ["*", ""], ["0", "+"], ["#", ""]
  ];

  function render(root) {
    const body = h("div", { class: "content", style: { display: "flex", flexDirection: "column", padding: "0" } });
    const tabs = [
      ["star", "Favorites"], ["clock", "Recents"], ["person", "Contacts"], ["keypad", "Keypad"], ["voicemail", "Voicemail"]
    ];
    let active = 3;
    const tabbar = h("div", "tabbar", tabs.map(([ico, lbl], i) => {
      const t = h("div", "tab" + (i === active ? " on" : ""), h("div", { class: "t-ico", html: Glyphs[ico]() }), h("div", null, lbl));
      t.addEventListener("click", () => { Snd.click(); active = i; [...tabbar.children].forEach((x, j) => x.classList.toggle("on", j === i)); show(i); });
      return t;
    }));

    root.append(body, tabbar);

    function show(i) {
      body.innerHTML = "";
      [favView, recentsView, contactsView, keypadView, vmView][i]();
    }

    /* --- keypad --- */
    function keypadView() {
      let number = "";
      const numEl = h("div", "ph-number");
      const hintEl = h("div", "ph-name-hint");
      const upd = () => {
        numEl.textContent = number;
        const c = contactByNumber(number);
        hintEl.textContent = c ? contactName(c) : "";
      };
      const pad = h("div", "keypad", KEYS.map(([n, l]) => {
        const k = h("div", "kp-key", h("div", "kp-num", n), h("div", "kp-let", l || " "));
        k.addEventListener("click", () => { Snd.dtmf(n); number += n; upd(); });
        return k;
      }));
      const call = h("div", "kp-call", gl("phone", 20), h("span", null, "Call"));
      call.addEventListener("click", () => {
        if (!number) return;
        const c = contactByNumber(number);
        CallSession.start(root, { name: c ? contactName(c) : null, number });
      });
      const del = h("div", "kp-side", "⌫");
      del.addEventListener("click", () => { Snd.click(); number = number.slice(0, -1); upd(); });
      const addC = h("div", "kp-side", gl("person", 20));
      body.append(
        h("div", "ph-display", numEl, hintEl),
        pad,
        h("div", "kp-actions", addC, call, del));
    }

    /* --- favorites --- */
    function favView() {
      body.append(navbar("Favorites", { right: navBtn("+", () => {}) }));
      const list = h("div", { class: "content list", style: { flex: "1" } });
      CONTACTS.filter(c => c.fav).forEach(c => {
        list.append(cell({
          label: contactName(c),
          right: h("span", "fav-star", "mobile"),
          chev: true,
          onTap: () => CallSession.start(root, { name: contactName(c), number: c.phone })
        }));
      });
      body.append(list);
    }

    /* --- recents --- */
    function recentsView() {
      let filter = 0;
      const list = h("div", { class: "content list", style: { flex: "1" } });
      const paint = () => {
        list.innerHTML = "";
        RECENTS.filter(r => filter === 0 || r.type === "missed").forEach(r => {
          list.append(cell({
            label: h("span", { style: r.type === "missed" ? { color: "#c0392b" } : null }, r.name),
            sub: (r.type === "out" ? "Outgoing Call" : r.type === "in" ? "Incoming Call" : "Missed Call"),
            value: r.time, chev: true,
            onTap: () => CallSession.start(root, { name: r.name })
          }));
        });
        if (!list.children.length) list.append(h("div", "empty-msg", "No Missed Calls"));
      };
      body.append(navbar("", { titleEl: seg(["All", "Missed"], 0, i => { filter = i; paint(); }) }), list);
      paint();
    }

    /* --- contacts tab --- */
    function contactsView() {
      body.append(navbar("All Contacts", { right: navBtn("+", () => {}) }));
      const wrap = h("div", { class: "content list", style: { flex: "1", position: "relative" } });
      // lightweight inline nav: pushing replaces the tab body, popping re-shows the tab
      const localNav = {
        push(v) {
          body.innerHTML = "";
          body.append(v);
        },
        pop() { show(2); }
      };
      contactListInto(localNav, wrap, root);
      body.append(wrap);
    }

    /* --- voicemail --- */
    function vmView() {
      body.append(navbar("Voicemail", { right: navBtn("Greeting", () => {}) }));
      const list = h("div", { class: "content list", style: { flex: "1" } });
      VOICEMAILS.forEach(v => {
        list.append(cell({
          label: v.from, sub: v.time,
          right: h("span", { class: "vm-cell-play", html: Glyphs.play() }),
          value: v.dur,
          onTap: () => showAlert({ title: "Voicemail", text: "“Hi, it's " + v.from + " — call me back when you can!”" })
        }));
      });
      list.append(h("div", "group-foot", "Voicemail is simulated. Your carrier is a JavaScript closure."));
      body.append(list);
    }

    show(active);
  }

  IOS.register({
    id: "phone",
    name: "Phone",
    icon: Icons.phone,
    statusbar: "blue",
    badge: () => 1,
    onClose() { CallSession.cleanup(); },
    render
  });

  return { addRecent };
})();

/* =================================================================
   Contacts (standalone)
   ================================================================= */

IOS.register({
  id: "contacts",
  name: "Contacts",
  icon: Icons.contacts,
  statusbar: "blue",
  render(root) {
    const nav = new UINav(root);
    const list = h("div", { class: "content list", style: { position: "relative" } });
    const repaint = () => { list.innerHTML = ""; contactListInto(nav, list, root); };
    repaint();

    function addContactView() {
      const first = kbField("First", { returnLabel: "next" });
      const last = kbField("Last", { returnLabel: "next" });
      const phone = kbField("Phone", { returnLabel: "Done" });
      let im = true;
      return navView(
        navbar("New Contact", {
          left: navBtn("Cancel", () => { KB.close(); nav.pop(); }),
          right: navBtn("Done", () => {
            KB.close();
            const f = first._value.trim(), p = phone._value.trim();
            if (!f && !p) return showAlert({ title: "New Contact", text: "A contact needs at least a name or a number." });
            const c = { id: "u" + Date.now(), first: f || p, last: last._value.trim(),
                        phone: p || "", email: "", imessage: im, fav: false };
            CONTACTS.push(c);
            Prefs.set("userContacts", [...Prefs.get("userContacts", []), c]);
            Snd.sent();
            nav.pop();
            repaint();
          }, "blue")
        }),
        h("div", "content grouped",
          group(
            h("div", { class: "cell static", style: { gap: "8px" } }, first),
            h("div", { class: "cell static", style: { gap: "8px" } }, last),
            h("div", { class: "cell static", style: { gap: "8px" } }, phone)),
          group(cell({ label: "iMessage", right: toggle(true, v => { im = v; }), cls: "static" })),
          h("div", "group-foot", "Saved contacts survive reboots and show up in Messages, Phone and Spotlight.")));
    }

    nav.push(navView(
      navbar("All Contacts", { left: navBtn("Groups", () => {}), right: navBtn("+", () => nav.push(addContactView())) }),
      list), false);
  }
});

/* =================================================================
   Mail
   ================================================================= */

IOS.register({
  id: "mail",
  name: "Mail",
  icon: Icons.mail,
  statusbar: "blue",
  badge: () => MAILBOX.filter(m => m.unread).length,
  render(root) {
    const nav = new UINav(root);
    const sent = () => Prefs.get("sentMail", []);

    function mailRow(m, onTap) {
      const row = h("div", "cell",
        h("div", "msg-unread" + (m.unread ? "" : " off")),
        h("div", "msg-cell-main",
          h("div", "msg-cell-top",
            h("span", "mail-from", m.from),
            h("span", "msg-cell-time", m.time + " ›")),
          h("div", "mail-subj", m.subject),
          h("div", "msg-cell-preview", m.body[0] + " " + (m.body[1] || ""))));
      row.addEventListener("click", () => { Snd.click(); onTap(); });
      return row;
    }

    function mailboxesView() {
      const unread = MAILBOX.filter(m => m.unread).length;
      return navView(
        navbar("Mailboxes"),
        h("div", "content grouped",
          group(
            cell({ label: "Inbox", ico: Glyphs.mailbox ? Glyphs.mailbox() : Glyphs.folder(), icoBg: "linear-gradient(#6f9be8,#2255c8)",
                   value: unread ? String(unread) : null, chev: true, onTap: () => nav.push(inboxView()) }),
            cell({ label: "Sent", ico: Glyphs.reply(), icoBg: "linear-gradient(#9aa6b8,#5c6a80)",
                   value: sent().length ? String(sent().length) : null, chev: true, onTap: () => nav.push(sentView()) })),
          h("div", "group-foot", "1 account · arch@example.com · Updated just now")));
    }

    function inboxView() {
      const list = h("div", "content list msg-list");
      MAILBOX.forEach(m => list.append(mailRow(m, () => { m.unread = false; nav.push(messageView(m, "Inbox")); })));
      const compose = h("span", { class: "tb-ico", html: Glyphs.compose() });
      compose.addEventListener("click", () => nav.push(composeView()));
      const refresh = h("span", { class: "tb-ico", html: Glyphs.refresh() });
      refresh.addEventListener("click", () => { Snd.click(); showAlert({ title: "Mail", text: "Checking for Mail…\nEverything is up to date (btw)." }); });
      return navView(
        navbar("Inbox" + (MAILBOX.some(m => m.unread) ? " (" + MAILBOX.filter(m => m.unread).length + ")" : ""), {
          left: backBtn("Mailboxes", () => nav.pop()),
          right: navBtn("Edit", () => {})
        }),
        list,
        h("div", "toolbar", refresh,
          h("span", { class: "tb-ico disabled", html: Glyphs.folder() }),
          h("span", { class: "tb-ico disabled", html: Glyphs.trash() }),
          h("span", { class: "tb-ico", html: Glyphs.reply() }), compose));
    }

    function sentView() {
      const list = h("div", "content list msg-list");
      if (!sent().length)
        list.append(h("div", { style: { textAlign: "center", color: "#8a919d", padding: "40px 20px", fontWeight: "bold" } },
          "No Sent Mail"));
      sent().forEach(m => list.append(mailRow(m, () => nav.push(messageView(m, "Sent")))));
      return navView(
        navbar("Sent", { left: backBtn("Mailboxes", () => nav.pop()) }),
        list);
    }

    function messageView(m, from) {
      const reply = h("span", { class: "tb-ico", html: Glyphs.reply() });
      reply.addEventListener("click", () => { Snd.click(); nav.push(composeView({
        to: m.from === "Me" ? (m.to || "") : m.from,
        subj: (m.subject.startsWith("Re:") ? "" : "Re: ") + m.subject })); });
      return navView(
        navbar(m.from, { left: backBtn(from, () => nav.pop()) }),
        h("div", "content",
          h("div", "mail-hdr",
            h("div", "h-row", h("b", null, m.from), m.to ? " → " + m.to : null),
            h("div", "h-row", m.subject),
            h("div", "h-row", "Today " + m.time)),
          h("div", "mail-body-view", m.body.map(p => h("p", null, p)))),
        h("div", "toolbar",
          h("span", { class: "tb-ico disabled", html: Glyphs.folder() }),
          h("span", { class: "tb-ico disabled", html: Glyphs.trash() }),
          reply));
    }

    function composeView(prefill = {}) {
      const to = kbField("To:", { returnLabel: "next" });
      const subj = kbField("Subject", { returnLabel: "next" });
      const bodyF = kbField("", { returnLabel: "return" });
      if (prefill.to) { to._value = prefill.to; to._renderValue && to._renderValue(); }
      if (prefill.subj) { subj._value = prefill.subj; subj._renderValue && subj._renderValue(); }
      bodyF.style.minHeight = "120px";
      bodyF.style.whiteSpace = "normal";
      return navView(
        navbar("New Message", {
          left: navBtn("Cancel", () => { KB.close(); nav.pop(); }),
          right: navBtn("Send", () => {
            KB.close();
            const msg = {
              from: "Me", to: to._value || "(no recipient)",
              subject: subj._value || "(no subject)",
              time: fmtTime(new Date()),
              body: [bodyF._value || "(no text — the linen speaks for itself)"]
            };
            Prefs.set("sentMail", [msg, ...sent()].slice(0, 30));
            Snd.sent();
            nav.pop();
          }, "blue")
        }),
        h("div", { class: "content", style: { padding: "8px", display: "flex", flexDirection: "column", gap: "6px" } },
          to, subj, bodyF));
    }

    nav.push(mailboxesView(), false);
    nav.push(inboxView());
  }
});

</script>
<script>
/* ===================================================================
   iOS 6 · Arch Edition — Calendar, Notes, Reminders, Clock,
   Calculator, Settings, Weather, Stocks, Maps
   =================================================================== */
"use strict";

/* =================================================================
   Calendar
   ================================================================= */

IOS.register({
  id: "calendar",
  name: "Calendar",
  icon: Icons.calendar,
  statusbar: "blue",
  render(root) {
    const today = new Date();
    let ym = { y: today.getFullYear(), m: today.getMonth() };
    let selected = today.getDate();

    const titleB = h("b");
    const gridEl = h("div", "cal-grid");
    const evEl = h("div", "cal-events");

    const dateKey = d => d.toISOString().slice(0, 10);
    function eventsFor(date) {
      const diff = Math.round((date - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
      const custom = Prefs.get("calEvents", {})[dateKey(date)] || [];
      return [...(CAL_EVENTS[diff] || []), ...custom];
    }
    function addEvent() {
      const when = kbField("Time (e.g. 3:00 PM)", { returnLabel: "next" });
      const what = kbField("Event name", { returnLabel: "Done", blueReturn: true, onReturn: () => KB.close() });
      const wrap = h("div", "sheet-wrap", h("div", "sheet",
        h("div", { style: { color: "#fff", fontWeight: "bold", textAlign: "center", paddingBottom: "6px" } },
          "New Event — " + MONTHS[ym.m] + " " + selected),
        when, what,
        h("button", { style: { marginTop: "6px" }, onclick: () => {
          if (!what.value.trim()) return;
          const all = Prefs.get("calEvents", {});
          const k = dateKey(new Date(ym.y, ym.m, selected));
          (all[k] = all[k] || []).push({ time: when.value.trim() || "All day", name: what.value.trim() });
          Prefs.set("calEvents", all);
          KB.close(); wrap.remove(); Snd.click(); paint();
        } }, "Save"),
        h("button", { class: "cancel", onclick: () => { KB.close(); wrap.remove(); } }, "Cancel")));
      $id("screen").append(wrap);
    }

    function paint() {
      titleB.textContent = MONTHS[ym.m] + " " + ym.y;
      gridEl.innerHTML = "";
      const first = new Date(ym.y, ym.m, 1);
      const daysIn = new Date(ym.y, ym.m + 1, 0).getDate();
      const daysPrev = new Date(ym.y, ym.m, 0).getDate();
      const lead = first.getDay();
      const cells = [];
      for (let i = lead - 1; i >= 0; i--) cells.push({ d: daysPrev - i, dim: true });
      for (let d = 1; d <= daysIn; d++) cells.push({ d, dim: false });
      while (cells.length % 7) cells.push({ d: cells.length % 7, dim: true, trail: true });
      let trail = 0;
      cells.forEach((c, i) => {
        if (c.trail) { trail++; c.d = trail; }
        const date = new Date(ym.y, ym.m, c.dim ? (c.trail ? daysIn + c.d : -(lead - i - 1)) : c.d);
        const isToday = !c.dim && ym.y === today.getFullYear() && ym.m === today.getMonth() && c.d === today.getDate();
        const el = h("div", "cal-day" + (c.dim ? " dim" : "") + (isToday ? " today" : "") +
          (!c.dim && c.d === selected && ym.m === today.getMonth() && ym.y === today.getFullYear() ? "" : ""),
          String(c.d),
          !c.dim && eventsFor(date).length ? h("div", "dot") : null);
        if (!c.dim) el.addEventListener("click", () => {
          Snd.click();
          selected = c.d;
          gridEl.querySelectorAll(".sel").forEach(x => x.classList.remove("sel"));
          el.classList.add("sel");
          paintEvents();
        });
        gridEl.append(el);
      });
      paintEvents();
    }

    function paintEvents() {
      evEl.innerHTML = "";
      const evs = eventsFor(new Date(ym.y, ym.m, selected));
      if (!evs.length) evEl.append(h("div", "empty-msg", "No Events"));

IOS.register({
  id: "clock",
  name: "Clock",
  icon: Icons.clock,
  statusbar: "black",
  rootClass: "clock-root",
  onClose() { this._ivals && this._ivals.forEach(clearInterval); this._ivals = []; },
  render(root) {
    const def = IOS.app("clock");
    def._ivals = def._ivals || [];
    const body = h("div", { class: "content", style: { background: "#26262a", display: "flex", flexDirection: "column" } });
    let active = 0;
    const tabs = [["globe", "World Clock"], ["alarm", "Alarm"], ["stopwatch", "Stopwatch"], ["timer", "Timer"]];
    const tabbar = h("div", "tabbar", tabs.map(([ico, lbl], i) => {
      const t = h("div", "tab" + (i === active ? " on" : ""), h("div", { class: "t-ico", html: Glyphs[ico]() }), h("div", null, lbl));
      t.addEventListener("click", () => { Snd.click(); active = i; [...tabbar.children].forEach((x, j) => x.classList.toggle("on", j === i)); show(i); });
      return t;
    }));
    root.append(body, tabbar);

    function analogClock(offsetHours, size = 60) {
      const c = h("canvas", { width: size * 2, height: size * 2, style: { width: size + "px", height: size + "px" } });
      const g = c.getContext("2d");
      function draw() {
        const now = new Date();
        const utc = now.getTime() + now.getTimezoneOffset() * 60000;
        const d = new Date(utc + offsetHours * 3600000);
        const R = size;
        g.clearRect(0, 0, R * 2, R * 2);
        const night = d.getHours() < 6 || d.getHours() >= 18;
        g.fillStyle = night ? "#111" : "#f4f5f7";
        g.beginPath(); g.arc(R, R, R - 3, 0, 7); g.fill();
        g.strokeStyle = "#666"; g.lineWidth = 3; g.stroke();
        g.strokeStyle = night ? "#fff" : "#111";
        const hand = (frac, len, w) => {
          const a = frac * 2 * Math.PI - Math.PI / 2;
          g.lineWidth = w; g.beginPath(); g.moveTo(R, R);
          g.lineTo(R + Math.cos(a) * len, R + Math.sin(a) * len); g.stroke();
        };
        hand(((d.getHours() % 12) + d.getMinutes() / 60) / 12, R * 0.45, 5);
        hand(d.getMinutes() / 60, R * 0.7, 3);
        g.strokeStyle = "#d33"; hand(d.getSeconds() / 60, R * 0.75, 1.5);
      }
      draw();
      def._ivals.push(setInterval(draw, 1000));
      return c;
    }

    function worldView() {
      const cities = [["Cupertino", -7], ["New York", -4], ["London", 1], ["Berlin", 2], ["Tokyo", 9]];
      cities.forEach(([name, off]) => {
        const dig = h("div", "wc-digital");
        const sub = h("div", "wc-sub");
        function upd() {
          const now = new Date();
          const utc = now.getTime() + now.getTimezoneOffset() * 60000;
          const d = new Date(utc + off * 3600000);
          dig.textContent = fmtTime(d, false);
          const dayDiff = d.getDate() - now.getDate();
          sub.textContent = (dayDiff === 0 ? "Today" : dayDiff > 0 ? "Tomorrow" : "Yesterday") +
            ", " + (off >= 0 ? "+" : "") + off + " HRS (UTC)";
        }
        upd();
        def._ivals.push(setInterval(upd, 1000));
        body.append(h("div", "wc-row", analogClock(off), h("div", "wc-info", h("div", "wc-city", name), sub), dig));
      });
    }

    function alarmView() {
      const alarms = Prefs.get("alarms", [{ time: "6:00 AM", label: "pacman -Syu", on: false }, { time: "9:41 AM", label: "Keynote", on: true }]);
      const save = () => Prefs.set("alarms", alarms);
      const paint = () => { body.innerHTML = ""; build(); };
      function build() {
        alarms.forEach((a, i) => {
          const row = h("div", "wc-row",
            h("div", "wc-info", h("div", "wc-city", a.time), h("div", "wc-sub", a.label)),
            toggle(a.on, v => { alarms[i].on = v; save(); }));
          let lp = null;
          row.addEventListener("pointerdown", () => { lp = setTimeout(() => showSheet([
            { label: "Delete “" + (a.label || a.time) + "”", style: "destructive", onTap: () => { alarms.splice(i, 1); save(); paint(); } },
            { label: "Cancel", style: "cancel" }]), 550); });
          ["pointerup", "pointerleave"].forEach(ev => row.addEventListener(ev, () => clearTimeout(lp)));
          body.append(row);
        });
        // add-alarm controls
        const hr = h("select", null, Array.from({ length: 12 }, (_, i) => h("option", { value: i + 1 }, i + 1)));
        const mn = h("select", null, Array.from({ length: 60 }, (_, i) => h("option", { value: i }, String(i).padStart(2, "0"))));
        const ap = h("select", null, ["AM", "PM"].map(x => h("option", { value: x }, x)));
        const now = new Date(); hr.value = String(((now.getHours() % 12) || 12)); mn.value = String((now.getMinutes() + 1) % 60); ap.value = now.getHours() < 12 ? "AM" : "PM";
        const lbl = kbField("Label", { returnLabel: "Done", onReturn: () => KB.close() });
        lbl.style.background = "#303036"; lbl.style.color = "#fff"; lbl.style.borderColor = "#55555c";
        body.append(
          h("div", "timer-set", hr, mn, ap),
          h("div", { style: { padding: "0 16px 8px" } }, lbl),
          h("div", { style: { padding: "0 16px 14px" } },
            h("button", { class: "big-blue-btn", onclick: () => {
              alarms.push({ time: hr.value + ":" + String(mn.value).padStart(2, "0") + " " + ap.value,
                label: lbl.value || "Alarm", on: true });
              save(); Snd.click(); paint();
            } }, "Add Alarm")),
          h("div", { class: "wc-sub", style: { padding: "0 16px 14px", color: "#8a8a90" } },
            "Alarms genuinely fire — even from the lock screen. Long-press one to delete."));
      }
      build();
    }

    function stopwatchView() {
      let t0 = null, acc = 0, iv = null;
      const face = h("div", "sw-face", "00:00.0");
      const laps = h("div", "sw-laps");
      const fmt = ms => {
        const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, d = Math.floor(ms / 100) % 10;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + d;
      };
      const startBtn = h("button", "sw-btn green", "Start");
      const lapBtn = h("button", "sw-btn", "Lap");
      startBtn.addEventListener("click", () => {
        Snd.click();
        if (iv) {
          acc += Date.now() - t0; clearInterval(iv); iv = null;
          startBtn.textContent = "Start"; startBtn.className = "sw-btn green";
        } else {
          t0 = Date.now();
          iv = setInterval(() => { face.textContent = fmt(acc + Date.now() - t0); }, 100);
          def._ivals.push(iv);
          startBtn.textContent = "Stop"; startBtn.className = "sw-btn red";
        }
      });
      lapBtn.addEventListener("click", () => {
        Snd.click();
        if (iv) laps.prepend(h("div", "wc-row", h("div", "wc-info", "Lap"), h("div", null, face.textContent)));
        else { acc = 0; face.textContent = "00:00.0"; laps.innerHTML = ""; }
      });
      body.append(face, h("div", "sw-btns", lapBtn, startBtn), laps);
    }

    function timerView() {
      let remain = 0, iv = null;
      const face = h("div", "timer-face", "00:00");
      const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      const mins = h("select", null, Array.from({ length: 61 }, (_, i) => h("option", { value: i }, i + " min")));
      mins.value = "5";
      const secs = h("select", null, Array.from({ length: 60 }, (_, i) => h("option", { value: i }, i + " sec")));
      const startBtn = h("button", "sw-btn green", "Start");
      startBtn.addEventListener("click", () => {
        Snd.click();
        if (iv) { clearInterval(iv); iv = null; startBtn.textContent = "Start"; startBtn.className = "sw-btn green"; return; }
        remain = (+mins.value) * 60 + (+secs.value);
        if (!remain) return;
        face.textContent = fmt(remain);
        startBtn.textContent = "Cancel"; startBtn.className = "sw-btn red";
        iv = setInterval(() => {
          remain--;
          face.textContent = fmt(Math.max(0, remain));
          if (remain <= 0) {
            clearInterval(iv); iv = null;
            startBtn.textContent = "Start"; startBtn.className = "sw-btn green";
            Snd.tri();
            showAlert({ title: "Timer Done", text: "Ding! (marimba unavailable, tri-tone provided)" });
          }
        }, 1000);
        def._ivals.push(iv);
      });
      body.append(face, h("div", "timer-set", mins, secs), h("div", "sw-btns", h("div"), startBtn));
    }

    function show(i) {
      def._ivals.forEach(clearInterval); def._ivals = [];
      body.innerHTML = "";
      [worldView, alarmView, stopwatchView, timerView][i]();
    }
    show(0);
  }
});

IOS.register({
  id: "calculator",
  name: "Calculator",
  icon: Icons.calculator,
  statusbar: "black",
  rootClass: "calc-root",
  render(root) {
    let display = "0", acc = null, op = null, fresh = true;
    const disp = h("div", "calc-display", "0");
    const upd = () => {
      let out = display;
      if (out.replace(/[-.]/g, "").length > 9) out = parseFloat(out).toExponential(4);
      disp.textContent = out;
      disp.style.fontSize = out.length > 7 ? (out.length > 10 ? "30px" : "40px") : "52px";
    };
    const calc = () => {
      const b = parseFloat(display), a = acc;
      if (op === "+") return a + b;
      if (op === "−") return a - b;
      if (op === "×") return a * b;
      if (op === "÷") return b === 0 ? NaN : a / b;
      return b;
    };
    const grid = h("div", "calc-grid");
    const keys = [
      ["C", "dark"], ["±", "dark"], ["%", "dark"], ["÷", "op"],
      ["7", ""], ["8", ""], ["9", ""], ["×", "op"],
      ["4", ""], ["5", ""], ["6", ""], ["−", "op"],
      ["1", ""], ["2", ""], ["3", ""], ["+", "op"],
      ["0", "zero"], [".", ""], ["=", "op"]
    ];
    keys.forEach(([k, cls]) => {
      const b = h("button", "calc-btn " + cls, k);
      b.addEventListener("click", () => {
        Snd.key();
        if (/\d/.test(k)) {
          display = fresh || display === "0" ? k : display + k;
          fresh = false;
        } else if (k === ".") {
          if (fresh) { display = "0."; fresh = false; }
          else if (!display.includes(".")) display += ".";
        } else if (k === "C") {
          display = "0"; acc = null; op = null; fresh = true;
          grid.querySelectorAll(".hl").forEach(x => x.classList.remove("hl"));
        } else if (k === "±") {
          display = display.startsWith("-") ? display.slice(1) : (display === "0" ? display : "-" + display);
        } else if (k === "%") {
          display = String(parseFloat(display) / 100);
        } else if (k === "=") {
          if (op !== null) { display = String(calc()); acc = null; op = null; }
          fresh = true;
          grid.querySelectorAll(".hl").forEach(x => x.classList.remove("hl"));
        } else { // operator
          if (op !== null && !fresh) { display = String(calc()); }
          acc = parseFloat(display);
          op = k; fresh = true;
          grid.querySelectorAll(".hl").forEach(x => x.classList.remove("hl"));
          b.classList.add("hl");
        }
        upd();
      });
      grid.append(b);
    });
    root.append(disp, grid);
  }
});

          slider(Prefs.get("brightness", 100), v => { Prefs.set("brightness", v); IOS.applyBrightness(); }))),
        h("div", "group-label", "Wallpaper"),
        group(h("div", "wp-row", thumbs.map(([cls, label]) => {
          const t = h("div", { class: "wp-thumb " + cls + (cur === cls ? " sel" : ""), title: label });
          t.addEventListener("click", () => {
            Snd.click();
            Prefs.set("wallpaper", cls);
            IOS.applyWallpaper();
            t.parentElement.querySelectorAll(".sel").forEach(x => x.classList.remove("sel"));
            t.classList.add("sel");
          });
          return t;
        }))));
    });

    /* tone pickers: tap = select + live preview, checkmark follows */
    const tonePicker = (title, names, prefKey, def, preview) => () => {
      const list = h("div", "group");
      names.forEach(n => {
        const c = cell({ label: n, onTap: () => {
          Prefs.set(prefKey, n); preview(n);
          list.querySelectorAll(".c-check").forEach(x => x.remove());
          c.append(h("div", "c-check", "✓"));
        } });
        if (Prefs.get(prefKey, def) === n) c.append(h("div", "c-check", "✓"));
        list.append(c);
      });
      nav.push(navView(
        navbar(title, { left: backBtn("Sounds", () => nav.pop()) }),
        h("div", "content grouped", list,
          h("div", "group-foot", "Tap a tone to hear it. Synthesized live — no audio files on this entire telephone."))));
    };
    const ringtonePicker = tonePicker("Ringtone", Snd.ringtoneNames(), "ringtone", "Marimba", n => Snd.ringtone(n));
    const textTonePicker = tonePicker("Text Tone", Snd.textToneNames(), "textTone", "Tri-tone", n => Snd.textTone(n));

    const soundsView = sub("Sounds", () => h("div", "content grouped",
      group(
        cell({ label: "Ringtone", value: Prefs.get("ringtone", "Marimba"), chev: true, onTap: ringtonePicker }),
        cell({ label: "Text Tone", value: Prefs.get("textTone", "Tri-tone"), chev: true, onTap: textTonePicker }),
        cell({ label: "Keyboard Clicks", right: toggle(Prefs.get("kbClicks", true), v => Prefs.set("kbClicks", v)), cls: "static" })),
      h("div", "group-foot", "The ringtone also rings incoming calls; the text tone plays for every banner.")));

    const messagesView = sub("Messages", () => h("div", "content grouped",
      group(cell({ label: "iMessage", right: toggle(true, () => {}), cls: "static" })),
      h("div", "group-foot", "iMessages can be sent between iPhone, iPad, iPod touch and, apparently, Arch Linux."),
      group(
        cell({ label: "Send Read Receipts", right: toggle(false, () => {}), cls: "static" }),
        cell({ label: "Send as SMS", right: toggle(true, () => {}), cls: "static" }))));

    const main = navView(
      navbar("Settings"),
      h("div", "content grouped",
        group(
          cell({ label: "Airplane Mode", ico: Glyphs.plane(), icoBg: "linear-gradient(#fbb96b,#e8850f)",
                 right: toggle(Prefs.get("airplane", false), v => { Prefs.set("airplane", v); IOS.refreshSignal(); }), cls: "static" }),
          cell({ label: "Wi-Fi", ico: Glyphs.wifi(), icoBg: "linear-gradient(#6f9be8,#2255c8)", value: Prefs.get("wifi", true) ? "archnet-5G" : "Off", chev: true, onTap: wifiView }),
          cell({ label: "Bluetooth", ico: Glyphs.bluetooth(), icoBg: "linear-gradient(#6f9be8,#1a44b0)", value: "Off", chev: true, onTap: () => {} }),
          cell({ label: "Do Not Disturb", ico: Glyphs.moon(), icoBg: "linear-gradient(#8a6ad0,#4a2a98)",
                 right: toggle(Prefs.get("dnd", false), v => { Prefs.set("dnd", v); window.DND && DND.refresh(); }), cls: "static" })),
        group(
          cell({ label: "Notifications", ico: Glyphs.bell(), icoBg: "linear-gradient(#f07a6a,#c02a1a)", chev: true, onTap: () => {} }),
          cell({ label: "General", ico: Glyphs.gear(), icoBg: "linear-gradient(#b0b8c2,#767f8b)", chev: true, onTap: generalView }),
          cell({ label: "Sounds", ico: Glyphs.speaker(), icoBg: "linear-gradient(#ea6aa8,#c02a68)", chev: true, onTap: soundsView }),
          cell({ label: "Brightness & Wallpaper", ico: Glyphs.sun(), icoBg: "linear-gradient(#6f9be8,#2255c8)", chev: true, onTap: wallpaperView }),
          cell({ label: "Privacy", ico: Glyphs.hand(), icoBg: "linear-gradient(#6a7ae8,#2a3ac0)", chev: true, onTap: () => showAlert({ title: "Privacy", text: "This phone runs entirely in your browser tab. Nothing leaves it. Even the NSA is bored." }) })),
        group(
          cell({ label: "iCloud", ico: Glyphs.cloud(), icoBg: "linear-gradient(#7ac0ec,#2a80c0)", value: "off (self-hosted)", chev: true, onTap: () => {} }),
          cell({ label: "Messages", ico: Glyphs.bubble(), icoBg: "linear-gradient(#8ee968,#2f9e13)", chev: true, onTap: messagesView }),
          cell({ label: "Phone", ico: Glyphs.phone(), icoBg: "linear-gradient(#9be36f,#2f8f13)", value: "(555) 019-4141", chev: true, onTap: () => {} }),
          cell({ label: "Safari", ico: Glyphs.compassMini(), icoBg: "linear-gradient(#7cc4f4,#1244a8)", chev: true, onTap: () => {} })),
        h("div", "group-foot", "iOS 6.1.3 · Linux " + NativeBridge.get("kernel", "6.9.7-arch1-1") +
          (NativeBridge.active ? " · native" : " · simulated") + " · btw")));
    nav.push(main, false);
  }
});

IOS.register({
  id: "weather",
  name: "Weather",
  icon: Icons.weather,
  statusbar: "black",
  rootClass: "weather-root",
  render(root) {
    const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const CITIES = [
      { name: "Cupertino", lat: 37.32, lon: -122.03 },
      { name: "Berlin", lat: 52.52, lon: 13.41 },
      { name: "Tokyo", lat: 35.68, lon: 139.69 }
    ];
    // WMO weather codes -> our drawn condition glyphs + a label
    const wmo = code =>
      code === 0 ? ["wsun", "Clear"] :
      code <= 2 ? ["wpartly", "Partly Cloudy"] :
      code === 3 ? ["wpartly", "Overcast"] :
      code < 50 ? ["wpartly", "Fog"] :
      code < 70 ? ["wrain", "Rain"] :
      code < 80 ? ["wrain", "Snow"] :
      code < 95 ? ["wrain", "Showers"] : ["wstorm", "Thunderstorm"];
    const F = c => Math.round(c * 9 / 5 + 32);

    const pages = h("div", "wx-pages");
    const dots = h("div", { id: "wx-dots", style: { display: "flex", justifyContent: "center", gap: "8px", padding: "8px 0" } });
    let cur = 0;
    function snap() {
      pages.style.transform = `translateX(${-cur * 320}px)`;
      [...dots.children].forEach((d, i) => d.style.background = i === cur ? "#fff" : "rgba(255,255,255,.35)");
    }

    function cityPage(city) {
      const el = h("div", "wx-page");
      // seed with plausible numbers immediately; live data replaces them
      const seedFx = [["wsun", 75, 58], ["wpartly", 72, 57], ["wsun", 78, 60], ["wrain", 66, 55], ["wstorm", 64, 54], ["wpartly", 70, 56]];
      function paint(fx, nowT, cond, foot) {
        el.innerHTML = "";
        const todayIdx = new Date().getDay();
        el.append(
          h("div", "wx-city", city.name),
          h("div", "wx-cond", cond),
          h("div", "wx-now", h("span", { class: "wx-icon-big", html: Glyphs[fx[0][0]]() }), h("span", "wx-big", nowT + "°")),
          h("div", "wx-hl", "H: " + fx[0][1] + "°  L: " + fx[0][2] + "°"),
          h("div", "wx-week", fx.map(([ico, hi, lo], i) =>
            h("div", "wx-row",
              h("span", "d", i === 0 ? "Today" : DAYS[(todayIdx + i) % 7]),
              h("span", { class: "w-i", html: Glyphs[ico]() }),
              h("span", null, hi + "°"),
              h("span", "lo", lo + "°")))),
          h("div", "wx-foot", foot));
      }
      paint(seedFx, 73, "Sunny", "offline forecast — goes live when the device has internet");

      fetch("https://api.open-meteo.com/v1/forecast?latitude=" + city.lat + "&longitude=" + city.lon +
            "&current_weather=true&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto")
        .then(r => r.json())
        .then(d => {
          if (!d || !d.daily || !d.current_weather) return;
          const fx = d.daily.time.slice(0, 6).map((_, i) =>
            [wmo(d.daily.weather_code[i])[0], F(d.daily.temperature_2m_max[i]), F(d.daily.temperature_2m_min[i])]);
          paint(fx, F(d.current_weather.temperature), wmo(d.current_weather.weathercode)[1],
            "live · open-meteo · wind " + Math.round(d.current_weather.windspeed) + " km/h · updated " + fmtTime(new Date()));
        })
        .catch(() => { /* stay on the seed forecast */ });
      return el;
    }

    CITIES.forEach((c, i) => {
      pages.append(cityPage(c));
      dots.append(h("i", { style: { width: "7px", height: "7px", borderRadius: "50%", background: "rgba(255,255,255,.35)" } }));
    });

    // swipe between cities
    let x0 = null, dx = 0;
    root.addEventListener("pointerdown", e => { x0 = e.clientX; dx = 0; });
    root.addEventListener("pointermove", e => { if (x0 !== null) dx = e.clientX - x0; });
    root.addEventListener("pointerup", () => {
      if (x0 === null) return;
      if (dx < -50 && cur < CITIES.length - 1) cur++;
      else if (dx > 50 && cur > 0) cur--;
      snap(); x0 = null;
    });

    root.append(h("div", "wx-viewport", pages), dots);
    snap();
  }
});

IOS.register({
  id: "stocks",
  name: "Stocks",
  icon: Icons.stocks,
  statusbar: "black",
  rootClass: "stocks-root",
  onClose() { clearInterval(this._iv); },
  render(root) {
    const def = IOS.app("stocks");
    const rows = h("div", { class: "content", style: { background: "transparent", flex: "0 0 auto" } });
    const canvas = h("canvas", { width: 600, height: 220 });
    let selected = 0;

    // user-added tickers persist alongside the built-in list
    Prefs.get("stocksExtra", []).forEach(x => {
      if (!STOCKS.some(s => s.sym === x.sym)) STOCKS.push(x);
    });

    function detail(i) {
      const s = STOCKS[i];
      const seed = s.sym.split("").reduce((a, ch) => a + ch.charCodeAt(0), 0);
      showSheet([
        { label: s.sym + " — open " + (s.price - s.chg).toFixed(2) + " · high " + (s.price + seed % 7).toFixed(2) +
                 " · low " + (s.price - seed % 5).toFixed(2), onTap: () => {} },
        { label: "Show chart", onTap: () => { selected = i; paintChart(); } },
        { label: "Remove from watchlist", style: "destructive", onTap: () => {
            STOCKS.splice(i, 1);
            Prefs.set("stocksExtra", Prefs.get("stocksExtra", []).filter(x => x.sym !== s.sym));
            if (selected >= STOCKS.length) selected = 0;
            paintRows(); paintChart();
          } },
        { label: "Cancel", style: "cancel" }
      ]);
    }

    let pctMode = Prefs.get("stocksPct", false);
    function paintRows() {
      rows.innerHTML = "";
      STOCKS.forEach((s, i) => {
        const chg = h("div", "stk-chg " + (s.chg >= 0 ? "up" : "down"),
          pctMode
            ? (s.chg >= 0 ? "+" : "") + (s.chg / Math.max(1, s.price - s.chg) * 100).toFixed(2) + "%"
            : (s.chg >= 0 ? "+" : "") + s.chg.toFixed(2));
        // the classic iOS 6 move: tapping the badge flips $ <-> %
        chg.addEventListener("click", e => {
          e.stopPropagation(); Snd.click();
          pctMode = !pctMode; Prefs.set("stocksPct", pctMode); paintRows();
        });
        const r = h("div", "stk-row",
          h("div", "stk-sym", h("b", null, s.sym), h("span", null, s.name)),
          h("div", "stk-price", s.price.toFixed(2)),
          chg);
        r.addEventListener("click", () => { Snd.click(); selected = i; paintChart(); });
        let lp = null;
        r.addEventListener("pointerdown", () => { lp = setTimeout(() => detail(i), 550); });
        ["pointerup", "pointerleave"].forEach(ev => r.addEventListener(ev, () => clearTimeout(lp)));
        rows.append(r);
      });
    }

    function addTicker() {
      const field = kbField("Ticker symbol (e.g. TUX)", {
        returnLabel: "Add", blueReturn: true,
        onReturn: v => {
          KB.close(); wrap.remove();
          const sym = v.trim().toUpperCase().slice(0, 5);
          if (!/^[A-Z]{1,5}$/.test(sym) || STOCKS.some(s => s.sym === sym)) return;
          const seed = sym.split("").reduce((a, ch) => a + ch.charCodeAt(0), 0);
          const st = { sym, name: sym + " Holdings (fict.)", price: 20 + seed % 300, chg: ((seed % 11) - 5) / 2 };
          STOCKS.push(st);
          Prefs.set("stocksExtra", [...Prefs.get("stocksExtra", []), st]);
          paintRows();
        }
      });
      const wrap = h("div", { class: "sheet-wrap" },
        h("div", "sheet",
          h("div", { style: { color: "#fff", fontWeight: "bold", textAlign: "center", paddingBottom: "6px" } }, "Add Stock"),
          field,
          h("button", { class: "cancel", style: { marginTop: "8px" }, onclick: () => wrap.remove() }, "Cancel")));
      $id("screen").append(wrap);
    }

    function paintChart() {
      const g = canvas.getContext("2d");
      const s = STOCKS[selected];
      g.clearRect(0, 0, 600, 220);
      g.strokeStyle = "#2c2c34";
      for (let y = 30; y < 220; y += 45) { g.beginPath(); g.moveTo(0, y); g.lineTo(600, y); g.stroke(); }
      let seed = s.sym.split("").reduce((a, c) => a + c.charCodeAt(0), 0);
      const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      const pts = [];
      let v = 110;
      for (let i = 0; i <= 60; i++) { v += (rnd() - (s.chg >= 0 ? 0.42 : 0.58)) * 14; v = Math.max(30, Math.min(190, v)); pts.push(v); }
      g.beginPath();
      pts.forEach((p, i) => { const x = i * 10, y = p; i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.strokeStyle = s.chg >= 0 ? "#57c93f" : "#e0574b";
      g.lineWidth = 3; g.stroke();
      g.lineTo(600, 220); g.lineTo(0, 220); g.closePath();
      g.fillStyle = s.chg >= 0 ? "rgba(87,201,63,.13)" : "rgba(224,87,75,.13)";
      g.fill();
      g.fillStyle = "#9aa"; g.font = "bold 22px Helvetica";
      g.fillText(s.sym + "  ·  1d", 12, 26);
    }

    def._iv = setInterval(() => {
      STOCKS.forEach(s => {
        const d = (Math.random() - 0.5) * 0.6;
        s.price = Math.max(1, s.price + d);
        s.chg += d;
      });
      paintRows();
    }, 4000);

    root.append(
      navbar("Stocks", { dark: true,
        left: navBtn("+", () => addTicker()),
        right: navBtn(gl("info", 15), () => showAlert({ title: "Stocks", text: "Quotes are randomly generated and 20 minutes into the future. Long-press a row for details / remove." })) }),
      rows,
      h("div", "stk-chart-wrap", canvas),
      h("div", "stk-foot", "Tap + to add a ticker · long-press a row to remove. LNX up forever."));
    paintRows();
    paintChart();
  }
});
